<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>קלוריות</title>
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קלוריות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2420;--mut:#6b766f;--line:#e3e8e4;--acc:#16a34a;--acc2:#dcfce7;--warn:#dc2626;
 --kc:#16a34a;--pr:#2563eb;--cb:#d97706;--ft:#db2777;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--card:#1a201d;--ink:#e8eeea;--mut:#93a099;--line:#2a332e;--acc2:#163222}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;gap:8px;justify-content:space-between}
header h1{font-size:1.05rem;margin:0;text-align:center;flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.15rem;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.big{font-size:2rem;font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:.88rem}
.bars{display:grid;gap:10px;margin-top:14px}
.bar .t{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.bar .tr{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fi{height:100%;border-radius:6px}
.meal h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:8px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.it .ph{width:52px;height:52px;border-radius:12px;flex:none;background:var(--acc2);display:grid;place-items:center;font-size:1.4rem}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .kc{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.fab{position:fixed;white-space:nowrap;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:5}
.fab button{border:0;border-radius:999px;padding:16px 22px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab .cam{background:var(--acc);color:#fff;font-size:1.05rem}
.fab .txt{background:var(--card);border:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--acc);color:#fff}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--warn);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
label.f{display:block;margin-top:10px;font-size:.9rem;color:var(--mut)}
input.i,select.i,textarea.i{width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea.i{min-height:80px;resize:vertical}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .pn{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:1.15rem}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px;display:block}
.ed{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.ed .top{display:flex;gap:8px;align-items:center}
.ed .top input{flex:1}
.ed .x{border:0;background:none;color:var(--warn);font-size:1.3rem;padding:4px 8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.g4 label{font-size:.75rem;color:var(--mut)}
.g4 input{width:100%;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center}
.gr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem}
.gr input{width:90px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center}
.sum{display:flex;justify-content:space-between;font-weight:700;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--acc2)}
.load{text-align:center;padding:30px 0}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--warn);background:rgba(220,38,38,.08);padding:10px 12px;border-radius:12px;margin-top:10px;font-size:.92rem}
.note{font-size:.85rem;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.9rem}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
table.h{width:100%;border-collapse:collapse;font-size:.9rem}
table.h th,table.h td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
table.h td:first-child,table.h th:first-child{text-align:right}
.wk{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--mut);height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);min-height:2px}
.wk i.ov{background:var(--warn)}
a{color:var(--acc)}
.steps{padding-inline-start:20px;margin:6px 0}
.steps li{margin:4px 0}
.burn{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.burn .ln{display:flex;justify-content:space-between;font-size:.92rem;margin:3px 0}
.burn .df{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:1.05rem}
.burn .df.ok{background:var(--acc2);color:var(--acc)}
.burn .df.bad{background:rgba(220,38,38,.1);color:var(--warn)}
.burn .bt{display:flex;gap:8px;margin-top:10px}
.burn .bt button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:600;font-size:.92rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sel{display:flex;gap:6px;margin-top:4px}
.sel button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px}
.sel button.on{background:var(--acc);border-color:var(--acc);color:#fff}
ol.sc{padding-inline-start:22px;margin:8px 0}
ol.sc li{margin:7px 0;font-size:.93rem}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.88rem;direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="ib" id="bSet" aria-label="הגדרות">⚙️</button>
    <button class="ib" id="bNext" aria-label="יום הבא">›</button>
    <h1 id="dTitle">היום</h1>
    <button class="ib" id="bPrev" aria-label="יום קודם">‹</button>
    <button class="ib" id="bHist" aria-label="היסטוריה">📊</button>
  </header>

  <div class="card">
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="ringC" cx="48" cy="48" r="40" fill="none" stroke="var(--kc)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="251.3" stroke-dashoffset="251.3" transform="rotate(-90 48 48)"/>
      </svg>
      <div>
        <div class="big" id="kTot">0</div>
        <div class="mut" id="kSub">מתוך 2000 קלוריות</div>
        <div class="mut" id="kLeft"></div>
      </div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="burn" id="burn"></div>
  </div>

  <div id="meals"></div>
</div>

<div class="fab">
  <button class="txt" id="bTxt">✏️ בלי תמונה</button>
  <button class="cam" id="bCam">📷 צלם אוכל</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<!-- add / review -->
<div class="sheet" id="shAdd"><div class="pn" id="addPn"></div></div>
<!-- settings -->
<div class="sheet" id="shSet"><div class="pn" id="setPn"></div></div>
<!-- history -->
<div class="sheet" id="shHist"><div class="pn" id="histPn"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0);
const r1=n=>Math.round((+n||0)*10)/10;
const MAC=[['kcal','קלוריות','var(--kc)'],['protein','חלבון','var(--pr)'],['carbs','פחמימות','var(--cb)'],['fat','שומן','var(--ft)']];
const MEALS=['בוקר','צהריים','ערב','נשנוש'];

/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let S=LS.get('kal-set',{key:'',goal:{kcal:2000,protein:120,carbs:220,fat:65}});
S.prof=S.prof||{sex:'m',age:0,h:0,w:0};S.sc=S.sc||'קלוריות כושר';
let DB=LS.get('kal-db',{});            // {'2026-11-23':[entry,...]}
let FIT=LS.get('kal-fit',{});          // {'2026-11-23':{act,rest,t}}  burned kcal from Apple Health (via Shortcuts) or typed
function save(){
  if(LS.set('kal-db',DB))return;
  // storage full: drop the oldest photos and retry
  const days=Object.keys(DB).sort();
  for(const d of days){for(const e of DB[d])if(e.img){delete e.img;if(LS.set('kal-db',DB))return}}
  toast('האחסון מלא');
}
const dk=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
let day=dk(new Date());

/* ---------- totals ---------- */
function totals(list){const t={kcal:0,protein:0,carbs:0,fat:0};
  for(const e of list||[])for(const it of e.items)for(const k in t)t[k]+=+it[k]||0;return t}

/* ---------- burned calories / deficit ---------- */
function bmr(){const p=S.prof;if(!(p.age>0&&p.h>0&&p.w>0))return 0;return 10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5)}
function dayFrac(){const n=new Date();return (n.getHours()*60+n.getMinutes())/1440}
// {rest,act,tot,restEst} or null when nothing is known about that day
function burnOf(d){
  const f=FIT[d],today=d===dk(new Date()),b=bmr();
  let rest=f&&f.rest>0?f.rest:null,act=f?(+f.act||0):0,restEst=false;
  if(rest==null&&b){rest=today?b*dayFrac():b;restEst=true}
  if(rest==null&&!f)return null;
  return {rest:rest||0,act,tot:(rest||0)+act,restEst,noRest:rest==null,t:f&&f.t};
}
function renderBurn(t){
  const el=$('#burn'),bu=burnOf(day),today=day===dk(new Date());
  let h='';
  if(bu&&!bu.noRest){
    const df=bu.tot-t.kcal;
    h+=`<div class="ln"><span>🍽️ אכלת</span><b>${r0(t.kcal)}</b></div>
      <div class="ln"><span>🔥 שרפת${today?' עד עכשיו':''}</span><b>${r0(bu.tot)}</b></div>
      <div class="ln mut"><span>מנוחה ${r0(bu.rest)}${bu.restEst?' (חישוב)':''} + פעילות ${r0(bu.act)}</span>
      <span>${bu.t?'עודכן '+bu.t:''}</span></div>
      <div class="df ${df>=0?'ok':'bad'}"><span>${df>=0?'✅ גירעון':'⚠️ עודף'}</span><span>${r0(Math.abs(df))} קל׳</span></div>`;
  }else if(bu&&bu.noRest){
    h+=`<div class="ln"><span>🔥 פעילות</span><b>${r0(bu.act)}</b></div>
      <div class="note">כדי לחשב גירעון חסרה "אנרגיה במנוחה". הכנס גיל, גובה ומשקל ב-⚙️ הגדרות.</div>`;
  }else{
    h+=`<div class="note">⌚ חבר את אפליקציית הבריאות כדי לראות כמה שרפת ומה הגירעון היומי.</div>`;
  }
  h+=`<div class="bt">${today?'<button id="bSync">⌚ סנכרן כושר</button>':''}<button id="bFitMan">✏️ הזן שריפה</button></div>`;
  el.innerHTML=h;
  if($('#bSync'))$('#bSync').onclick=syncFit;
  $('#bFitMan').onclick=()=>openFitSheet(false);
}
let syncPending=0;
function syncFit(){
  if(!S.scReady){openHelp();return}
  syncPending=Date.now();
  location.href='shortcuts://run-shortcut?name='+encodeURIComponent(S.sc);
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&syncPending&&Date.now()-syncPending<5*60e3){syncPending=0;setTimeout(()=>openFitSheet(true),300)}
});
function num(s){
  s=String(s||'').replace(/[^\d.,]/g,'');if(!s)return NaN;
  if(s.includes('.')&&s.includes(','))s=s.replace(/,/g,'');
  else if(/^\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  return parseFloat(s);
}
function parseFit(txt){
  const m=String(txt||'').match(/KALFIT\s*;([^;\n]*);([^;\n]*)(?:;([^;\n]*))?/i);if(!m)return null;
  const act=num(m[1]),rest=num(m[2]);
  let d=m[3]&&m[3].match(/(\d{4})-(\d{2})-(\d{2})/)?m[3].match(/\d{4}-\d{2}-\d{2}/)[0]:dk(new Date());
  if(isNaN(act)&&isNaN(rest))return null;
  return {d,act:isNaN(act)?0:act,rest:isNaN(rest)?0:rest};
}
function putFit(d,act,rest){FIT[d]={act:r0(act),rest:r0(rest),t:new Date().toTimeString().slice(0,5)};LS.set('kal-fit',FIT)}
function openFitSheet(fromShortcut){
  const f=FIT[day]||{};
  $('#addPn').innerHTML=`<h2>⌚ קלוריות שנשרפו</h2>
    ${fromShortcut?`<p class="note">קיצור הדרך העתיק את הנתונים. לחץ על הכפתור ואז על "הדבק" שקופץ.</p>
      <button class="btn" id="fPaste" style="width:100%;font-size:1.1rem;padding:16px">📋 הדבק נתונים</button>`:''}
    <div class="g2" style="margin-top:12px">
      <label class="f" style="margin:0">פעילות (אנרגיה פעילה)<input class="i" type="number" inputmode="numeric" id="fAct" value="${f.act??''}"></label>
      <label class="f" style="margin:0">מנוחה (ריק = חישוב)<input class="i" type="number" inputmode="numeric" id="fRest" value="${f.rest||''}"></label>
    </div>
    <label class="f">או הדבק כאן את הטקסט מקיצור הדרך<input class="i" id="fTxt" placeholder="KALFIT;…" dir="ltr"></label>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="fC">ביטול</button><button class="btn" id="fOk">שמור</button></div>
    ${day===dk(new Date())?'<button class="btn sec" id="fHelp" style="width:100%;margin-top:8px">❔ איך בונים את קיצור הדרך</button>':''}`;
  open('#shAdd');
  const fill=o=>{$('#fAct').value=r0(o.act);$('#fRest').value=o.rest?r0(o.rest):''};
  $('#fTxt').oninput=()=>{const o=parseFit($('#fTxt').value);if(o)fill(o)};
  if($('#fPaste'))$('#fPaste').onclick=async()=>{
    try{const o=parseFit(await navigator.clipboard.readText());
      if(!o){toast('לא מצאתי נתונים בלוח. הרץ שוב את קיצור הדרך.');return}
      putFit(o.d,o.act,o.rest);S.scReady=1;LS.set('kal-set',S);close('#shAdd');render();toast('סונכרן ✓ 🔥 '+r0(o.act+o.rest))}
    catch(e){toast('לא הצלחתי לקרוא. הדבק ידנית בשדה למטה.');$('#fTxt').focus()}};
  $('#fC').onclick=()=>close('#shAdd');
  if($('#fHelp'))$('#fHelp').onclick=openHelp;
  $('#fOk').onclick=()=>{const a=num($('#fAct').value),r=num($('#fRest').value);
    if(isNaN(a)&&isNaN(r)){delete FIT[day];LS.set('kal-fit',FIT)}else putFit(day,isNaN(a)?0:a,isNaN(r)?0:r);
    close('#shAdd');render();toast('נשמר ✓')};
}
function openHelp(){
  $('#addPn').innerHTML=`<h2>⌚ חיבור לאפליקציית הבריאות</h2>
    <p class="note">אפליקציה מהאתר לא יכולה לקרוא את הבריאות ישירות, אז נבנה פעם אחת קיצור דרך קטן שקורא את המספרים ומעתיק אותם. בערך 3 דקות.</p>
    <ol class="sc">
      <li>פתח את אפליקציית <b>קיצורים</b> (Shortcuts) ולחץ <b>+</b></li>
      <li>קרא לקיצור בדיוק: <code>${esc(S.sc)}</code></li>
      <li>הוסף פעולה <b>חפש דגימות בריאות</b> (Find Health Samples): סוג = <b>אנרגיה פעילה</b> (Active Energy), תאריך התחלה = <b>היום</b> (Today)</li>
      <li>הוסף <b>חשב סטטיסטיקה</b> (Calculate Statistics): <b>סכום</b> (Sum)</li>
      <li>שוב <b>חפש דגימות בריאות</b>: סוג = <b>אנרגיה במנוחה</b> (Resting Energy), היום</li>
      <li>שוב <b>חשב סטטיסטיקה</b>: <b>סכום</b>. אם הוא בוחר אוטומטית את התוצאה הקודמת, לחץ ובחר את דגימות המנוחה</li>
      <li>הוסף <b>טקסט</b> (Text) וכתוב בו: <code>KALFIT;</code> ואז את המשתנה <b>סטטיסטיקה</b> הראשון, <code>;</code> ואת השני</li>
      <li>הוסף <b>העתק ללוח</b> (Copy to Clipboard). סיימת!</li>
    </ol>
    <p class="note">בפעם הראשונה האייפון ישאל אם לתת גישה לבריאות — לחץ אפשר.<br>
    אחרי שהקיצור רץ, חזור לכאן ולחץ <b>📋 הדבק נתונים</b>.<br>
    אין לך שעון אפל? "אנרגיה במנוחה" תהיה ריקה, והאפליקציה תחשב אותה לפי הפרופיל בהגדרות.</p>
    <label class="f">שם הקיצור<input class="i" id="hName" value="${esc(S.sc)}"></label>

  const list=DB[day]||[],t=totals(list),g=S.goal;
  $('#kTot').textContent=r0(t.kcal);
  $('#kSub').textContent='מתוך '+g.kcal+' קלוריות';
  const left=g.kcal-t.kcal;
  $('#kLeft').textContent=left>=0?'נשארו '+r0(left):'חריגה של '+r0(-left);

  let h='';
  for(const m of MEALS){
    const es=list.map((e,i)=>[e,i]).filter(([e])=>e.meal===m);if(!es.length)continue;
    const mt=totals(es.map(x=>x[0]));
    h+=`<div class="card meal"><h3><span>${m}</span><span class="mut">${r0(mt.kcal)} קל׳</span></h3>`;
    for(const [e,i] of es){
      const et=totals([e]);
      h+=`<div class="it" data-i="${i}">${e.img?`<img src="${e.img}" alt="">`:'<div class="ph">🍽️</div>'}
        <div class="nm"><b>${esc(e.items.map(x=>x.name).join(', ')||'ארוחה')}</b>
        <span class="mut">${e.time||''} · ח ${r0(et.protein)} · פ ${r0(et.carbs)} · ש ${r0(et.fat)}</span></div>
        <div class="kc">${r0(et.kcal)}</div></div>`;
    }

  }
  $('#meals').innerHTML=h;
}

/* ---------- image ---------- */
function shrink(file,max,q){return new Promise((ok,bad)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('img'))};im.src=url})}
function thumbOf(dataUrl){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=160/Math.max(im.width,im.height),
  c=document.createElement('canvas'),w=Math.round(im.width*s),h=Math.round(im.height*s),z=Math.min(w,h);
  c.width=c.height=120;c.getContext('2d').drawImage(im,(w-z)/2/s,(h-z)/2/s,z/s,z/s,0,0,120,120);ok(c.toDataURL('image/jpeg',.6))};im.src=dataUrl})}

/* ---------- Gemini (free tier) ---------- */
const API='https://generativelanguage.googleapis.com/v1beta/';
const SCHEMA={type:'OBJECT',properties:{items:{type:'ARRAY',items:{type:'OBJECT',properties:{
  name:{type:'STRING'},grams:{type:'NUMBER'},kcal:{type:'NUMBER'},protein:{type:'NUMBER'},carbs:{type:'NUMBER'},fat:{type:'NUMBER'}},
  required:['name','grams','kcal','protein','carbs','fat']}},notFood:{type:'BOOLEAN'}},required:['items']};
const PROMPT=`אתה תזונאי מומחה. זהה כל מאכל ומשקה ${'{SRC}'} והערך לכל אחד: שם קצר בעברית, משקל המנה בגרמים כפי שהיא נראית, קלוריות, חלבון, פחמימות ושומן בגרמים (לכל המנה, לא ל-100 גרם).
הערך גודל מנה לפי כלים, ידיים וחפצים בתמונה. כלול שמן, רטבים וממרחים אם נראים. אל תמציא מאכלים שלא רואים.
אם אין אוכל כלל — החזר items ריק ו-notFood=true.`;
// fetch with a time limit: a phone that can't reach Google should fail fast, not after minutes
const DIAG={};
async function fetchT(url,opts,ms,step){
  const ac=new AbortController(),t0=Date.now(),tm=setTimeout(()=>ac.abort(),ms);
  try{return await fetch(url,{...opts,signal:ac.signal})}
  catch(e){const to=ac.signal.aborted;DIAG.last=`${step}: ${to?'timeout':(e.name+': '+e.message)} · ${((Date.now()-t0)/1000).toFixed(1)}s`;
    throw Object.assign(new Error(to?'timeout':'net'),{code:to?'timeout':'net'})}
  finally{clearTimeout(tm)}
}
async function models(key,fresh){
  const c=LS.get('kal-models2',null);
  if(!fresh&&c&&c.k===key.slice(-6)&&Date.now()-c.t<864e5&&c.list.length)return c.list;
  const r=await fetchT(API+'models?pageSize=200&key='+encodeURIComponent(key),{},20000,'models');
  if(r.status===400||r.status===403){DIAG.last='models: HTTP '+r.status;throw Object.assign(new Error('key'),{code:'key'})}
  let list=[];
  try{
    const j=await r.json();
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?+m[1]:0};
    list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace('models/','')).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|live|audio|thinking|exp|embed|native/.test(n))
      // stable models first (preview models are often overloaded: HTTP 503), then flash before lite, newest first
      .sort((a,b)=>{const lite=n=>/lite/.test(n)?1:0,pre=n=>/preview/.test(n)?1:0;
        return pre(a)-pre(b)||lite(a)-lite(b)||ver(b)-ver(a)||a.length-b.length});
  }catch(e){}
  for(const a of ['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'])
    if(!list.includes(a))list.splice(list.findIndex(n=>/preview/.test(n))<0?list.length:list.findIndex(n=>/preview/.test(n)),0,a);
  LS.set('kal-models2',{k:key.slice(-6),t:Date.now(),list});
  return list;
}
async function gen(key,m,parts,schema,ms){
  const cfg={temperature:.2};
  if(schema){cfg.responseMimeType='application/json';cfg.responseSchema=schema}
  const url=API+'models/'+m+':generateContent?key='+encodeURIComponent(key);
  const send=c=>fetchT(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:c})},ms,m);
  // no "thinking" = much faster; models that don't accept the setting get it without
  let r=await send({...cfg,thinkingConfig:{thinkingBudget:0}});
  if(r.status===400){let msg='';try{msg=(await r.clone().json()).error?.message||''}catch(e){}
    if(/think/i.test(msg))r=await send(cfg)}
  return r;
}
async function analyze({img,text}){
  DIAG.last='';
  const key=(S.key||'').trim();if(!key)throw Object.assign(new Error('nokey'),{code:'nokey'});
  const parts=[];
  if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});
  parts.push({text:PROMPT.replace('{SRC}',img?'שרואים בתמונה':'בתיאור הבא')+(text?`\n${img?'הערה מהמשתמש':'התיאור'}: ${text}`:'')});
  let list=await models(key);let last='',tries=0;const log=[];
  const good=LS.get('kal-good','');if(good&&list.includes(good))list=[good,...list.filter(x=>x!==good)];
  for(const m of list.slice(0,10)){
    let r;
    const pg=document.getElementById('prog');if(pg&&log.length)pg.textContent=`גוגל עמוסים, מנסה עוד מודל (${log.length+1})…`;
    try{r=await gen(key,m,parts,SCHEMA,30000)}
    catch(e){if(e.code==='timeout'&&++tries<2){last='timeout';continue}throw e}
    if(r.ok){const j=await r.json();
      const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      try{const o=JSON.parse(t);o.model=m;LS.set('kal-good',m);return o}catch(e){last='parse';DIAG.last=m+': bad JSON';continue}}
    const st=r.status;let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
    log.push(`${m}: ${st}`);DIAG.last=log.join(' · ')+' — '+msg.slice(0,90);
    if(st===404)continue;                   // model name not offered to this key
    if(st===400&&/API key|API_KEY/i.test(msg))throw Object.assign(new Error('key'),{code:'key'});
    if(st===400&&/location|region|country/i.test(msg))throw Object.assign(new Error('geo'),{code:'geo'});
    if(st===403)throw Object.assign(new Error('key'),{code:'key'});
    if(st===429&&last!=='srv')last='quota';else if(st!==429)last='srv';   // busy / quota → try the next free model
    if(st===503)await new Promise(z=>setTimeout(z,800));
  }
  localStorage.removeItem('kal-models2');
  throw Object.assign(new Error(last),{code:last});
}
// Settings → "check connection": shows exactly where it breaks
async function testConn(out){
  const key=(S.key||'').trim(),line=(ok,t)=>out.insertAdjacentHTML('beforeend',`<div>${ok?'✅':'❌'} ${esc(t)}</div>`);
  out.innerHTML='';DIAG.last='';if(!key){line(0,'אין מפתח');return}
  let t0=Date.now(),list;
  try{list=await models(key,true);line(1,`גוגל עונה (${((Date.now()-t0)/1000).toFixed(1)} שנ׳) · ${list.length} מודלים`)}
  catch(e){line(0,(ERR[e.code]||'שגיאה')+' — '+(DIAG.last||''));return}
  let ok=0;
  for(const m of list.slice(0,10)){
    t0=Date.now();
    try{const r=await gen(key,m,[{text:'Reply with the word OK'}],null,25000);
      if(r.ok){line(1,`${m} עובד (${((Date.now()-t0)/1000).toFixed(1)} שנ׳)`);if(!ok)LS.set('kal-good',m);ok++;break}
      else line(0,`${m}: ${r.status}${r.status===503?' עמוס':r.status===429?' מכסה':r.status===404?' לא זמין':''}`)}
    catch(e){line(0,`${m}: ${e.code}`)}
  }
  line(ok>0,ok?'יש מודל שעובד — האפליקציה תשתמש בו.':'כל המודלים עמוסים או חסומים כרגע. נסה שוב בעוד כמה דקות.');
}

const NUMW={'אחד':1,'אחת':1,'שני':2,'שתי':2,'שניים':2,'שתיים':2,'שלוש':3,'שלושה':3,'ארבע':4,'ארבעה':4,'חמש':5,'חמישה':5,'שש':6,'שישה':6,'חצי':.5,'רבע':.25};
const normF=s=>' '+String(s).replace(/[֑-ׇ]/g,'').replace(/[׳`]/g,"'").replace(/[״]/g,'"').replace(/[,.;:!?()\-–—+\n]/g,' ').replace(/\s+/g,' ').trim()+' ';
// MY = what YOU eat: every saved item is remembered (per 100 g + your usual amount) and wins over the table and over Google
let MY=LS.get('kal-my',null);
const keyOf=n=>normF(n).trim();
function learn(it){
  const n=String(it.name||'').trim(),g=+it.grams||0;if(!n||!(g>0)||!(+it.kcal>0))return;
  const k=keyOf(n),o=MY[k]||{name:n,n:0},f=100/g;
  Object.assign(o,{name:n,kcal:r1(it.kcal*f),protein:r1(it.protein*f),carbs:r1(it.carbs*f),fat:r1(it.fat*f),unit:r0(g),n:o.n+1,last:Date.now()});
  MY[k]=o;
}
if(!MY){MY={};for(const d of Object.keys(DB).sort())for(const e of DB[d])for(const it of e.items)learn(it);LS.set('kal-my',MY)}
let FIDX=null;
function fidx(){if(FIDX)return FIDX;FIDX=[];
  for(const o of Object.values(MY))FIDX.push([keyOf(o.name),{names:[o.name],kcal:o.kcal,protein:o.protein,carbs:o.carbs,fat:o.fat,unit:o.unit,my:1}]);
  for(const f of FOODS)for(const n of f.names)if(!MY[keyOf(n)])FIDX.push([n,f]);
  FIDX=FIDX.filter(x=>x[0]);FIDX.sort((a,b)=>b[0].length-a[0].length);return FIDX}
function saveMy(){FIDX=null;LS.set('kal-my',MY)}
const STOP=/^(עם|של|גם|קצת|מנה|מנות|יחידה|יחידות|גרם|גר|ג|כף|כפות|כפית|כפיות|כוס|כוסות|ו|על|בלי|ללא|קטן|קטנה|גדול|גדולה|חצי|רבע|\d+(\.\d+)?)$/;
// text → {items, unknown:[words]}; gramsHint = grams the user typed for a single item
function localCalc(text,gramsHint){
  let s=normF(text);const items=[];
  for(const [n,f] of fidx()){
    const re=new RegExp(`(^| )([והבמש]?)${n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?= )`);let m;
    while((m=s.match(re))){
      const before=s.slice(0,m.index).trim().split(' ').slice(-3);
      let q=1,g=null;
      for(let i=before.length-1;i>=0;i--){const w=before[i].replace(/^[ו]/,'');
        if(/^(גרם|גר|ג)$/.test(w)&&i>0&&!isNaN(parseFloat(before[i-1]))){g=parseFloat(before[i-1]);break}
        if(/^(כף|כפות)$/.test(w)){g=15*(i>0&&!isNaN(parseFloat(before[i-1]))?parseFloat(before[i-1]):NUMW[before[i-1]]||1);break}
        if(/^(כפית|כפיות)$/.test(w)){g=5*(i>0&&!isNaN(parseFloat(before[i-1]))?parseFloat(before[i-1]):NUMW[before[i-1]]||1);break}
        if(!isNaN(parseFloat(w))){q=parseFloat(w);break}
        if(NUMW[w]!=null){q=NUMW[w];break}
        if(/^(כוס|כוסות|יחידה|יחידות|מנה|מנות|קטן|קטנה|גדול|גדולה|עם|של)$/.test(w))continue;
        break;                                  // another food's word: its number isn't ours
      }
      const after=s.slice(m.index+m[0].length).trim().split(' ');
      if(g==null&&!isNaN(parseFloat(after[0]))&&/^(גרם|גר|ג)$/.test(after[1]||''))g=parseFloat(after[0]);
      if(g==null)g=gramsHint>0?gramsHint:q*f.unit;
      const k=g/100;
      items.push({my:f.my,name:f.names[0],grams:r0(g),kcal:r0(f.kcal*k),protein:r1(f.protein*k),carbs:r1(f.carbs*k),fat:r1(f.fat*k)});
      s=s.slice(0,m.index)+' # '+s.slice(m.index+m[0].length);   // '#' keeps a used number from passing to the next food
    }
  }
  const unknown=s.trim().split(' ').map(w=>w.replace(/^[ו]/,'')).filter(w=>w.length>1&&w!=='#'&&!STOP.test(w)&&NUMW[w]==null);
  return {items,unknown};
}

/* ---------- review / edit ---------- */
function openReview(entry,idx){
  cur=entry;curIdx=idx;
  cur.items.forEach(x=>{if(!x.base)x.base={...x}});
  drawReview();open('#shAdd');
}
function drawReview(){
  const e=cur;
  let h=`<h2>${curIdx<0?'בדוק ואשר':'עריכת ארוחה'}</h2>${e.img?`<img class="prev" src="${e.img}" alt="" style="max-height:140px">`:''}
    <div class="chips" id="mc">${MEALS.map(m=>`<button data-m="${m}" class="${m===e.meal?'on':''}">${m}</button>`).join('')}</div>`;
  e.items.forEach((x,i)=>{
    h+=`<div class="ed" data-i="${i}"><div class="top"><input class="i" data-k="name" value="${esc(x.name)}" placeholder="שם המאכל" style="margin:0">
      <button class="x" data-del="${i}" aria-label="מחק">✕</button></div>
      <div class="gr">כמות <input type="number" inputmode="decimal" data-k="grams" value="${x.grams}"> גרם
      <span class="mut">(משנה את כל הערכים)</span></div>
      <div class="g4">${MAC.map(([k,n])=>`<div><label>${n}</label><input type="number" inputmode="decimal" data-k="${k}" value="${x[k]}"></div>`).join('')}</div></div>`;
  });
  const t=totals([e]);
  h+=`<button class="btn" id="rCalc" style="width:100%;margin-top:10px">✨ חשב קלוריות לפי השמות והכמויות</button>
    <button class="btn sec" id="rAdd" style="width:100%;margin-top:8px">+ הוסף מאכל</button>
    <div class="sum"><span>סה״כ</span><span id="rSum">${r0(t.kcal)} קל׳ · ח ${r0(t.protein)} · פ ${r0(t.carbs)} · ש ${r0(t.fat)}</span></div>
    <p class="note">זו הערכה. אם אתה יודע את הכמות המדויקת — תקן את הגרמים.</p>
    <div class="row" style="margin-top:12px">${curIdx>=0?'<button class="btn del" id="rDel">מחק</button>':''}
    <button class="btn sec" id="rC">ביטול</button><button class="btn" id="rOk">שמור ✓</button></div>`;
  $('#addPn').innerHTML=h;
  $('#mc').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;e.meal=b.dataset.m;
    $('#mc').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b))};
  $('#addPn').querySelectorAll('.ed input').forEach(inp=>inp.oninput=()=>{
    const ed=inp.closest('.ed'),x=e.items[+ed.dataset.i],k=inp.dataset.k;
    if(k==='name'){x.name=inp.value;return}
    const v=parseFloat(inp.value);
    if(k==='grams'){x.grams=isNaN(v)?0:v;x.gT=1;const b=x.base;
      if(b&&b.grams>0){const f=x.grams/b.grams;for(const [m] of MAC){x[m]=m==='kcal'?r0(b[m]*f):r1(b[m]*f);
        ed.querySelector(`[data-k="${m}"]`).value=x[m]}}}
    else{x[k]=isNaN(v)?0:v;x.base={...x,base:undefined}}
    const t=totals([e]);$('#rSum').textContent=`${r0(t.kcal)} קל׳ · ח ${r0(t.protein)} · פ ${r0(t.carbs)} · ש ${r0(t.fat)}`;
  });
  $('#addPn').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{e.items.splice(+b.dataset.del,1);drawReview()});
  $('#rAdd').onclick=()=>{e.items.push({name:'',grams:100,kcal:0,protein:0,carbs:0,fat:0});drawReview();
    const all=$('#addPn').querySelectorAll('.ed');all[all.length-1].querySelector('input').focus()};
  $('#rCalc').onclick=async()=>{
    const named=e.items.filter(x=>x.name.trim());
    if(!named.length){toast('כתוב קודם את שם המאכל');return}
    const out=[],ask=[];
    for(const x of e.items){
      if(!x.name.trim()){continue}
      if(x.kcal>0&&!x.gT&&x.base&&x.base.kcal===x.kcal&&x.done){out.push(x);continue}   // already calculated
      const lc=localCalc(x.name,x.gT?x.grams:0);
      if(lc.items.length===1&&!lc.unknown.length){const it=lc.items[0];it.name=x.name.trim();it.done=1;it.base={...it};out.push(it)}
      else ask.push(x);
    }
    if(!ask.length){e.items=out;drawReview();toast('חושב מהמאגר ✓');return}
    const b=$('#rCalc');b.disabled=true;b.textContent='מחשב…';busy=true;
    try{
      const o=await analyze({text:ask.map(x=>`${x.name.trim()}${x.gT&&x.grams>0?` — ${x.grams} גרם`:''}`).join('\n')+
        '\nהשתמש בדיוק בכמויות שכתובות (אם כתובות). אם לא כתובה כמות — מנה רגילה אחת. החזר פריט אחד לכל שורה.'});
      busy=false;
      if(!o.items?.length){toast('לא הצלחתי לזהות. נסה שם אחר.');b.disabled=false;b.textContent='✨ חשב שוב';return}
      e.items=out.concat(o.items.map(x=>{const it={name:x.name,grams:r0(x.grams),kcal:r0(x.kcal),protein:r1(x.protein),carbs:r1(x.carbs),fat:r1(x.fat),done:1};it.base={...it};return it}));
      drawReview();toast('חושב ✓ בדוק ושמור');
    }catch(er){busy=false;
      e.items=out.concat(ask);drawReview();
      toast((ERR[er.code]||ERR.srv).slice(0,70)+(out.length?' (מה שבמאגר חושב)':''));
      if(DIAG.last)$('#addPn').insertAdjacentHTML('beforeend',`<div class="err" dir="ltr" style="text-align:left">${esc(DIAG.last)}</div>`)}
  };
  $('#rC').onclick=()=>close('#shAdd');
  if($('#rDel'))$('#rDel').onclick=()=>{if(!confirm('למחוק את הארוחה?'))return;DB[day].splice(curIdx,1);if(!DB[day].length)delete DB[day];save();close('#shAdd');render()};
  $('#rOk').onclick=()=>{
    e.items=e.items.filter(x=>x.name.trim()||x.kcal>0).map(x=>{const o={...x};delete o.base;delete o.gT;delete o.done;o.name=o.name.trim()||'מאכל';return o});
    if(!e.items.length){toast('אין מה לשמור');return}
    if(curIdx<0){e.time=new Date().toTimeString().slice(0,5);e.id=Date.now();(DB[day]=DB[day]||[]).push(e)}
    else DB[day][curIdx]=e;
    e.items.forEach(learn);saveMy();
    save();close('#shAdd');render();toast('נשמר ✓');
  };
}

    <div class="note" id="sTestOut"></div>
    <h2 style="margin-top:18px">יעד יומי</h2>
    <div class="g4">${MAC.map(([k,n])=>`<div><label>${n}${k==='kcal'?'':' (ג׳)'}</label><input type="number" inputmode="numeric" id="g_${k}" value="${g[k]}"></div>`).join('')}</div>
    <h2 style="margin-top:18px">פרופיל (לחישוב שריפה במנוחה)</h2>
    <div class="sel" id="sSex"><button data-s="m" class="${S.prof.sex!=='f'?'on':''}">זכר</button><button data-s="f" class="${S.prof.sex==='f'?'on':''}">נקבה</button></div>
    <div class="g4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div><label>גיל</label><input type="number" inputmode="numeric" id="pA" value="${S.prof.age||''}"></div>
      <div><label>גובה (ס״מ)</label><input type="number" inputmode="numeric" id="pH" value="${S.prof.h||''}"></div>
      <div><label>משקל (ק״ג)</label><input type="number" inputmode="decimal" id="pW" value="${S.prof.w||''}"></div></div>
    <div class="note">משמש רק אם אין "אנרגיה במנוחה" מהשעון. ${bmr()?'עכשיו: '+r0(bmr())+' קל׳ ביום במנוחה.':''}</div>
    <div class="row" style="margin-top:16px"><button class="btn sec" id="sC">ביטול</button><button class="btn" id="sOk">שמור</button></div>
    <button class="btn sec" id="sFit" style="width:100%;margin-top:8px">⌚ חיבור לאפליקציית הבריאות</button>
    <h2 style="margin-top:22px">גיבוי</h2>
    <button class="btn sec" id="sMy" style="width:100%;margin-bottom:8px">⭐ המאגר שלי (${Object.keys(MY).length} מאכלים)</button>
    <div class="row"><button class="btn sec" id="sCsv">📄 טבלה (CSV)</button><button class="btn sec" id="sBak">💾 גיבוי</button></div>
    <button class="btn sec" id="sRes" style="width:100%;margin-top:8px">📥 שחזר מגיבוי</button>
    <input type="file" id="resF" accept=".json,application/json" hidden>
    <p class="note" style="text-align:center;margin-top:16px">גרסה 10</p>`;
  open('#shSet');
  $('#sC').onclick=()=>close('#shSet');
  $('#sSex').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;$('#sSex').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b))};
  $('#sTest').onclick=async()=>{const bt=$('#sTest');if(bt.disabled)return;bt.disabled=true;S.key=$('#sKey').value.trim();LS.set('kal-set',S);const o=$('#sTestOut');o.textContent='בודק…';await testConn(o);bt.disabled=false};
  $('#sFit').onclick=()=>{close('#shSet');openHelp()};
  $('#sOk').onclick=()=>{S.key=$('#sKey').value.trim();for(const [k] of MAC){const v=parseFloat($('#g_'+k).value);if(v>0)S.goal[k]=v}
    S.prof={sex:$('#sSex .on').dataset.s,age:+$('#pA').value||0,h:+$('#pH').value||0,w:num($('#pW').value)||0};
    LS.set('kal-set',S);localStorage.removeItem('kal-models2');close('#shSet');render();toast('נשמר ✓')};
  $('#sCsv').onclick=exportCsv;
  $('#sMy').onclick=()=>{close('#shSet');openMy()};
  $('#sBak').onclick=()=>download('kalori-backup-'+dk(new Date())+'.json',JSON.stringify({v:3,goal:S.goal,prof:S.prof,db:DB,fit:FIT,my:MY}),'application/json');
  $('#sRes').onclick=()=>{$('#resF').value='';$('#resF').click()};
  $('#resF').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(!o.db)throw 0;if(!confirm('לשחזר? זה יחליף את מה שיש עכשיו.'))return;
      DB=o.db;if(o.goal)S.goal=o.goal;if(o.prof)S.prof=o.prof;if(o.fit){FIT=o.fit;LS.set('kal-fit',FIT)}if(o.my){MY=o.my;saveMy()}LS.set('kal-set',S);save();close('#shSet');render();toast('שוחזר ✓')}
    catch(e){toast('קובץ גיבוי לא תקין')}};
}
function openMy(){
  const list=Object.entries(MY).sort((a,b)=>b[1].n-a[1].n||a[1].name.localeCompare(b[1].name));
  $('#histPn').innerHTML=`<h2>⭐ המאגר שלי</h2>
    <p class="note">כל מה שאתה שומר נזכר כאן. בפעם הבאה שתכתוב את אותו שם — החישוב מיידי, בלי גוגל. כדי לתקן ערכים: פשוט ערוך ושמור את המאכל ביומן.</p>
    ${list.length?`<table class="h"><tr><th>מאכל</th><th>מנה</th><th>קל׳</th><th>פעמים</th><th></th></tr>
    ${list.map(([k,o])=>`<tr><td>${esc(o.name)}</td><td>${o.unit} ג׳</td><td>${r0(o.kcal*o.unit/100)}</td><td>${o.n}</td>
      <td><button class="x" data-k="${esc(k)}" style="border:0;background:none;color:var(--warn);font-size:1.1rem">✕</button></td></tr>`).join('')}</table>`
      :'<div class="empty">עוד ריק. כל מאכל שתשמור ייכנס לכאן.</div>'}
    <button class="btn" id="myC" style="width:100%;margin-top:14px">סגור</button>`;
  open('#shHist');
  $('#myC').onclick=()=>close('#shHist');
  $('#histPn').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{delete MY[b.dataset.k];saveMy();openMy()});
}
function download(name,text,type){
  const blob=new Blob([text],{type});const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  let rows=[['תאריך','שעה','ארוחה','מאכל','גרם','קלוריות','חלבון','פחמימות','שומן']];
  for(const d of Object.keys(DB).sort())for(const e of DB[d])for(const x of e.items)
    rows.push([d,e.time||'',e.meal,x.name,x.grams,x.kcal,x.protein,x.carbs,x.fat]);
  download('kalori-'+dk(new Date())+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

/* ---------- history ---------- */
$('#bHist').onclick=()=>{
  const g=S.goal,days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dk(d))}
  const tt=days.map(d=>totals(DB[d]));const mx=Math.max(g.kcal*1.2,...tt.map(t=>t.kcal));
  const last7=tt.slice(-7).filter(t=>t.kcal>0);const avg=k=>last7.length?r0(last7.reduce((s,t)=>s+t[k],0)/last7.length):0;
  const dfOf=(d,t)=>{const b=burnOf(d);return b&&!b.noRest&&t.kcal>0?b.tot-t.kcal:null};
  const w7=days.slice(-7).map((d,i)=>dfOf(d,tt[7+i])).filter(x=>x!=null),wSum=w7.reduce((s,x)=>s+x,0);
  $('#histPn').innerHTML=`<h2>14 ימים אחרונים</h2>
    <div class="wk">${days.map((d,i)=>`<div><i class="${tt[i].kcal>g.kcal?'ov':''}" style="height:${tt[i].kcal/mx*100}%"></i>${+d.slice(8)}</div>`).join('')}</div>
    <p class="mut">ממוצע ב-7 הימים האחרונים (ימים עם רישום): <b>${avg('kcal')}</b> קל׳ · ח ${avg('protein')} · פ ${avg('carbs')} · ש ${avg('fat')}</p>
    ${w7.length?`<div class="sum" style="background:${wSum>=0?'var(--acc2)':'rgba(220,38,38,.1)'};color:${wSum>=0?'var(--acc)':'var(--warn)'}">
      <span>${wSum>=0?'גירעון':'עודף'} ב-7 ימים (${w7.length} ימים עם נתונים)</span><span>${r0(Math.abs(wSum))} קל׳ ≈ ${(Math.abs(wSum)/7700).toFixed(2)} ק״ג</span></div>`:''}
    <table class="h" style="margin-top:10px"><tr><th>יום</th><th>אכלת</th><th>שרפת</th><th>גירעון</th><th>ח/פ/ש</th></tr>
    ${days.slice().reverse().map((d,i)=>{const t=tt[13-i],b=burnOf(d),df=dfOf(d,t);return t.kcal||FIT[d]?`<tr data-d="${d}"><td>${new Date(d+'T12:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</td>
      <td style="color:${t.kcal>g.kcal?'var(--warn)':''}">${r0(t.kcal)}</td><td>${b&&!b.noRest?r0(b.tot):'–'}</td>
      <td style="color:${df==null?'':df>=0?'var(--acc)':'var(--warn)'}">${df==null?'–':(df<0?'+':'')+r0(Math.abs(df))}</td>
      <td class="mut">${r0(t.protein)}/${r0(t.carbs)}/${r0(t.fat)}</td></tr>`:''}).join('')}</table>
    <p class="note">גירעון ירוק = אכלת פחות ממה ששרפת. +אדום = עודף. בערך 7,700 קל׳ = ק״ג אחד. זו הערכה.</p>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="hCsv">📄 ייצא טבלה</button><button class="btn" id="hC">סגור</button></div>`;
  open('#shHist');
  $('#histPn').querySelectorAll('tr[data-d]').forEach(tr=>tr.onclick=()=>{day=tr.dataset.d;close('#shHist');render()});
  $('#hC').onclick=()=>close('#shHist');$('#hCsv').onclick=exportCsv;
};

/* ---------- no zoom at all: pinch, double tap, input focus ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();
  if(n-lastTouch<350&&!e.target.closest('input,textarea,select')){e.preventDefault();e.target.click&&e.target.closest('button,a,.it,tr,[data-d]')&&e.target.click()}
  lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

/* ---------- start ---------- */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
if(!S.key)setTimeout(openSet,400);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
