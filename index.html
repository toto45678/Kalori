<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>קלוריות</title>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0c100e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קלוריות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#101828;--mut:#667085;--line:#eaecf0;--soft:#f2f4f7;
 --acc:#12b76a;--accd:#039855;--acc2:#e3f8ee;--warn:#f04438;--warn2:#fef3f2;
 --kc:#12b76a;--pr:#2e90fa;--cb:#f79009;--ft:#ee46bc;--r:22px;
 --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c100e;--card:#161b19;--ink:#eef2f0;--mut:#98a2a0;--line:#252c29;--soft:#1e2421;
 --acc2:#123323;--warn2:#3a1514;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,background-color .15s,opacity .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.55}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:.86rem}
a{color:var(--acc)}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 0}
.top .hi{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.top .dt{color:var(--mut);font-size:.9rem}
.av{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,#32d583,#12b76a);color:#fff;font-weight:700;font-size:1.1rem;box-shadow:0 4px 12px rgba(18,183,106,.3)}
/* week strip */
.week{display:flex;align-items:center;gap:4px;margin-top:14px}
.week .wa{flex:none;width:28px;height:52px;border:0;background:none;color:var(--mut);font-size:1.3rem}
.week .wa[hidden]{visibility:hidden;display:block}
.week .d{flex:1;min-width:0;border:0;background:var(--card);border-radius:16px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--sh);font-size:.72rem;color:var(--mut)}
.week .d b{font-size:.95rem;color:var(--ink);font-weight:600}
.week .d svg{display:block}
.week .d.sel{background:var(--ink);color:var(--card)}
.week .d.sel b{color:var(--card)}
.week .d.fut{opacity:.4;pointer-events:none}
/* hero */
.hero{padding:18px 14px 16px}
.heroRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.stat{text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:700}
.stat span{color:var(--mut);font-size:.8rem}
.ringW{position:relative;width:164px;height:164px}
.ringW svg{position:absolute;inset:0}
.ringW .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringW .rc b{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.ringW .rc span{color:var(--mut);font-size:.85rem;margin-top:4px}
#ringC{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.mac .n{font-size:.8rem;color:var(--mut)}
.mac .tr{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;margin:5px 0 4px}
.mac .fi{height:100%;border-radius:7px;transition:width .6s}
.mac .v{font-size:.82rem;font-weight:600}
.mac .v span{color:var(--mut);font-weight:400}
/* deficit card */
.burnC{display:flex;align-items:center;gap:12px;padding:14px 16px}
.burnC .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--soft)}
.burnC .tx{flex:1;min-width:0}
.burnC .tx b{display:block;font-size:1.05rem}
.burnC .tx b.ok{color:var(--acc)}
.burnC .tx b.bad{color:var(--warn)}
.burnC .bt{display:flex;gap:6px;flex:none}
.pill{border:0;background:var(--soft);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.g{background:var(--acc2);color:var(--accd)}
.setup{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ecfdf3,#d1fadf);border:0;width:100%;text-align:right;color:#05603a}
@media (prefers-color-scheme:dark){.setup{background:linear-gradient(135deg,#123323,#0c2a1c);color:#a6f4c5}}
/* meals */
.meal{padding:14px 16px 8px}
.meal .mh{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.meal .mh .e{font-size:1.25rem}
.meal .mh h3{margin:0;font-size:1.02rem;flex:1}
.meal .mh .k{color:var(--mut);font-size:.88rem}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc2);color:var(--accd);font-size:1.35rem;line-height:1;display:grid;place-items:center;flex:none}
.meal .none{color:var(--mut);font-size:.86rem;padding:2px 0 10px}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it img{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
.it .ph{width:48px;height:48px;border-radius:14px;flex:none;background:var(--soft);display:grid;place-items:center;font-size:1.3rem}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .kc{font-weight:700;white-space:nowrap}
.it .kc small{font-weight:400;color:var(--mut);font-size:.75rem}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:flex-end;
  background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs{}@media (prefers-color-scheme:dark){.tabs{background:rgba(22,27,25,.9)}}
.tabs button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--mut);padding:4px 0;white-space:nowrap}
.tabs button i{font-style:normal;font-size:1.3rem;line-height:1.25;filter:grayscale(1);opacity:.75}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on i{filter:none;opacity:1}
.tabs .cam{color:var(--accd);font-weight:600}
.tabs .cam i{width:60px;height:60px;margin-top:-28px;border-radius:50%;background:linear-gradient(135deg,#32d583,#12b76a);display:grid;place-items:center;font-size:1.55rem;
  box-shadow:0 8px 20px rgba(18,183,106,.4);border:4px solid var(--bg);filter:none;opacity:1}
/* buttons + forms */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(18,183,106,.25)}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.del{background:var(--warn2);color:var(--warn);box-shadow:none}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
label.f{display:block;margin-top:12px;font-size:.86rem;color:var(--mut)}
input.i,select.i,textarea.i{width:100%;margin-top:5px;padding:12px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--soft);outline:none}
input.i:focus,textarea.i:focus{border-color:var(--acc);background:var(--card)}
textarea.i{min-height:84px;resize:vertical}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:fd .2s}
.sheet.on .pn{animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes fd{from{background:rgba(16,24,40,0)}}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet .pn{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .pn:before{content:"";display:block;width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 8px}
.sheet h2{margin:2px 0 8px;font-size:1.2rem;padding-left:44px;letter-spacing:-.01em}
.sheet h3.sub{margin:18px 0 6px;font-size:.95rem}
.shx{position:sticky;top:0;float:left;z-index:3;width:34px;height:34px;margin:-2px 0 0 -4px;border-radius:50%;border:0;background:var(--soft);font-size:.95rem;color:var(--mut);display:grid;place-items:center}
.full .pn{max-height:100vh;height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
.full .pn:before{display:none}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:18px;display:block}
.ed{background:var(--soft);border-radius:18px;padding:12px;margin-top:10px}
.ed .top{display:flex;gap:8px;align-items:center;padding:0}
.ed .top input{flex:1;background:var(--card)}
.ed .x{border:0;background:none;color:var(--warn);font-size:1.2rem;padding:4px 8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.g4 label{font-size:.74rem;color:var(--mut)}
.g4 input{width:100%;padding:9px 4px;border-radius:12px;border:0;background:var(--card);text-align:center;outline:none}
.gr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.88rem}
.gr input{width:90px;padding:9px;border-radius:12px;border:0;background:var(--card);text-align:center;outline:none}
.sum{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--acc2);color:var(--accd)}
.load{text-align:center;padding:34px 0;color:var(--mut)}
.spin{width:44px;height:44px;border:4px solid var(--soft);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--warn);background:var(--warn2);padding:12px 14px;border-radius:14px;margin-top:10px;font-size:.92rem}
.note{font-size:.84rem;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:.9rem}
.chips button.on{background:var(--ink);color:var(--card)}
table.h{width:100%;border-collapse:collapse;font-size:.88rem}
table.h th{font-weight:500;color:var(--mut);font-size:.78rem}
table.h th,table.h td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center}
table.h td:first-child,table.h th:first-child{text-align:right}
.wk{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:12px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;color:var(--mut);height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#32d583,#12b76a);min-height:3px}
.wk i.ov{background:linear-gradient(180deg,#f97066,#f04438)}
.steps{padding-inline-start:20px;margin:6px 0}
.steps li{margin:4px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sel{display:flex;gap:6px;margin-top:6px}
.sel button{flex:1;border:0;background:var(--soft);border-radius:14px;padding:11px 6px;font-size:.92rem}
.sel button.on{background:var(--ink);color:var(--card);font-weight:600}
ol.sc{padding-inline-start:22px;margin:8px 0}
ol.sc li{margin:7px 0;font-size:.93rem}
code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:.88rem;direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;z-index:20;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* add sheet */
.srch{position:relative;margin-top:6px}
.srch input{padding-right:42px}
.srch:before{content:"🔍";position:absolute;right:14px;top:50%;transform:translateY(-38%);font-size:.95rem;opacity:.6;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{border:0;background:var(--soft);border-radius:18px;padding:14px 12px;text-align:right;display:flex;flex-direction:column;gap:2px}
.tile i{font-style:normal;font-size:1.4rem}
.tile b{font-size:.93rem;font-weight:600}
.tile span{font-size:.74rem;color:var(--mut)}
.fr{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.fr .nm{flex:1;min-width:0}
.fr .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .nm span{font-size:.78rem;color:var(--mut)}
.fr .star{font-size:.7rem;background:var(--acc2);color:var(--accd);border-radius:6px;padding:0 5px;margin-inline-start:4px}
.qty{background:var(--soft);border-radius:16px;padding:10px 12px;margin:4px 0 8px}
.qty .chips{margin-top:0}
.qty .chips button{background:var(--card)}
.qty .gr input{background:var(--card)}
.ai{color:var(--accd)}
.bask{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));margin:14px -18px calc(-22px - env(safe-area-inset-bottom));padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.bask .t{flex:1;font-size:.9rem}
.bask .t b{display:block;font-size:1rem}
/* onboarding */
.onb{display:flex;flex-direction:column;min-height:100%}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:4px 0 18px}
.onb .dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.onb .dots i.on{width:22px;background:var(--acc)}
.onb .hero2{font-size:3.4rem;text-align:center;margin:18px 0 4px}
.onb h1{font-size:1.6rem;text-align:center;margin:0 0 6px;letter-spacing:-.02em}
.onb p.lead{text-align:center;color:var(--mut);margin:0 0 18px}
.onb .grow{flex:1}
.opt{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt button{border:1.5px solid transparent;background:var(--soft);border-radius:16px;padding:12px 14px;text-align:right;display:flex;gap:10px;align-items:center}
.opt button b{font-weight:600}
.opt button span{color:var(--mut);font-size:.8rem;display:block}
.opt button.on{border-color:var(--acc);background:var(--acc2)}
.goalbox{background:var(--soft);border-radius:20px;padding:16px;text-align:center;margin-top:8px}
.goalbox .big2{font-size:2.6rem;font-weight:800;color:var(--accd);line-height:1.1}
/* settings list */
.grp{background:var(--soft);border-radius:18px;margin-top:10px;overflow:hidden}
.grp button.li{width:100%;border:0;background:none;display:flex;align-items:center;gap:12px;padding:14px;text-align:right;border-bottom:1px solid var(--line)}
.grp button.li:last-child{border-bottom:0}
.grp .li i{font-style:normal;font-size:1.2rem;width:28px;text-align:center}
.grp .li .t{flex:1}
.grp .li .t span{display:block;font-size:.78rem;color:var(--mut)}
.grp .li:after{content:"‹";color:var(--mut);font-size:1.2rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="hi" id="hi">שלום</div><div class="dt" id="dTitle"></div></div>
    <button class="av" id="bAv" aria-label="הגדרות">🙂</button></div>
  <div class="week" id="week"></div>
  <div class="card hero">
    <div class="heroRow">
      <div class="stat"><b id="sEat">0</b><span>אכלת</span></div>
      <div class="ringW">
        <svg width="164" height="164" viewBox="0 0 164 164" aria-hidden="true">
          <defs><linearGradient id="gr1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ce9a6"/><stop offset="1" stop-color="#12b76a"/></linearGradient>
          <linearGradient id="gr2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fda29b"/><stop offset="1" stop-color="#f04438"/></linearGradient></defs>
          <circle cx="82" cy="82" r="70" fill="none" stroke="var(--soft)" stroke-width="14"/>
          <circle id="ringC" cx="82" cy="82" r="70" fill="none" stroke="url(#gr1)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="439.8" stroke-dashoffset="439.8" transform="rotate(-90 82 82)"/>
        </svg>
        <div class="rc"><b id="kLeft">0</b><span id="kLbl">נשארו</span></div>
      </div>
      <div class="stat"><b id="sGoal">0</b><span>יעד</span></div>
    </div>
    <div class="macros" id="bars"></div>
  </div>
  <div id="burn"></div>
  <div id="meals"></div>
</div>

<nav class="tabs">
  <button id="bToday" class="on"><i>🏠</i>יומן</button>
  <button id="bHist"><i>📊</i>היסטוריה</button>
  <button id="bCam" class="cam"><i>📷</i>צלם</button>
  <button id="bTxt"><i>✏️</i>הוסף</button>
  <button id="bSet"><i>⚙️</i>הגדרות</button>
</nav>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<!-- add / review -->
<div class="sheet" id="shAdd"><div class="pn"><button class="shx" aria-label="סגור">✕</button><div id="addPn"></div></div></div>
<!-- settings -->
<div class="sheet" id="shSet"><div class="pn"><button class="shx" aria-label="סגור">✕</button><div id="setPn"></div></div></div>
<!-- history -->
<div class="sheet full" id="shOnb"><div class="pn"><div id="onbPn"></div></div></div>
<div class="sheet" id="shHist"><div class="pn"><button class="shx" aria-label="סגור">✕</button><div id="histPn"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0);
const r1=n=>Math.round((+n||0)*10)/10;
const MAC=[['kcal','קלוריות','var(--kc)'],['protein','חלבון','var(--pr)'],['carbs','פחמימות','var(--cb)'],['fat','שומן','var(--ft)']];
const MEALS=['בוקר','צהריים','ערב','נשנוש'];

/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let S=LS.get('kal-set',{key:'',goal:{kcal:2000,protein:120,carbs:220,fat:65}});
S.prof=S.prof||{sex:'m',age:0,h:0,w:0};S.sc=S.sc||'קלוריות כושר';
let DB=LS.get('kal-db',{});            // {'2026-11-23':[entry,...]}
let FIT=LS.get('kal-fit',{});          // {'2026-11-23':{act,rest,t}}  burned kcal from Apple Health (via Shortcuts) or typed
function save(){
  if(LS.set('kal-db',DB))return;
  // storage full: drop the oldest photos and retry
  const days=Object.keys(DB).sort();
  for(const d of days){for(const e of DB[d])if(e.img){delete e.img;if(LS.set('kal-db',DB))return}}

function totals(list){const t={kcal:0,protein:0,carbs:0,fat:0};
  for(const e of list||[])for(const it of e.items)for(const k in t)t[k]+=+it[k]||0;return t}

function bmr(){const p=S.prof;if(!(p.age>0&&p.h>0&&p.w>0))return 0;return 10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5)}
function dayFrac(){const n=new Date();return (n.getHours()*60+n.getMinutes())/1440}
// {rest,act,tot,restEst} or null when nothing is known about that day
function burnOf(d){
  const f=FIT[d],today=d===dk(new Date()),b=bmr();
  let rest=f&&f.rest>0?f.rest:null,act=f?(+f.act||0):0,restEst=false;
  if(rest==null&&b){rest=today?b*dayFrac():b;restEst=true}
  if(rest==null&&!f)return null;
  return {rest:rest||0,act,tot:(rest||0)+act,restEst,noRest:rest==null,t:f&&f.t};
}

function num(s){

  if(s.includes('.')&&s.includes(','))s=s.replace(/,/g,'');

  else s=s.replace(',','.');

}
function parseFit(txt){

function shrink(file,max,q){return new Promise((ok,bad)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('img'))};im.src=url})}
function thumbOf(dataUrl){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=160/Math.max(im.width,im.height),
  c=document.createElement('canvas'),w=Math.round(im.width*s),h=Math.round(im.height*s),z=Math.min(w,h);
  c.width=c.height=120;c.getContext('2d').drawImage(im,(w-z)/2/s,(h-z)/2/s,z/s,z/s,0,0,120,120);ok(c.toDataURL('image/jpeg',.6))};im.src=dataUrl})}

const PROMPT=`אתה תזונאי מומחה. זהה כל מאכל ומשקה ${'{SRC}'} והערך לכל אחד: שם קצר בעברית, משקל המנה בגרמים כפי שהיא נראית, קלוריות, חלבון, פחמימות ושומן בגרמים (לכל המנה, לא ל-100 גרם).

אם אין אוכל כלל — החזר items ריק ו-notFood=true.`;
// fetch with a time limit: a phone that can't reach Google should fail fast, not after minutes
const DIAG={};
async function fetchT(url,opts,ms,step){
  const ac=new AbortController(),t0=Date.now(),tm=setTimeout(()=>ac.abort(),ms);
  try{return await fetch(url,{...opts,signal:ac.signal})}
  catch(e){const to=ac.signal.aborted;DIAG.last=`${step}: ${to?'timeout':(e.name+': '+e.message)} · ${((Date.now()-t0)/1000).toFixed(1)}s`;
    throw Object.assign(new Error(to?'timeout':'net'),{code:to?'timeout':'net'})}
  finally{clearTimeout(tm)}
}
async function models(key,fresh){
  const c=LS.get('kal-models2',null);
  if(!fresh&&c&&c.k===key.slice(-6)&&Date.now()-c.t<864e5&&c.list.length)return c.list;
  const r=await fetchT(API+'models?pageSize=200&key='+encodeURIComponent(key),{},20000,'models');
  if(r.status===400||r.status===403){DIAG.last='models: HTTP '+r.status;throw Object.assign(new Error('key'),{code:'key'})}
  let list=[];
  try{
    const j=await r.json();
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?+m[1]:0};
    list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace('models/','')).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|live|audio|thinking|exp|embed|native/.test(n))
      // stable models first (preview models are often overloaded: HTTP 503), then flash before lite, newest first
      .sort((a,b)=>{const lite=n=>/lite/.test(n)?1:0,pre=n=>/preview/.test(n)?1:0;
        return pre(a)-pre(b)||lite(a)-lite(b)||ver(b)-ver(a)||a.length-b.length});
  }catch(e){}
  for(const a of ['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'])
    if(!list.includes(a))list.splice(list.findIndex(n=>/preview/.test(n))<0?list.length:list.findIndex(n=>/preview/.test(n)),0,a);
  LS.set('kal-models2',{k:key.slice(-6),t:Date.now(),list});
  return list;
}
async function gen(key,m,parts,schema,ms){
  const cfg={temperature:.2};
  if(schema){cfg.responseMimeType='application/json';cfg.responseSchema=schema}
  const url=API+'models/'+m+':generateContent?key='+encodeURIComponent(key);
  const send=c=>fetchT(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:c})},ms,m);
  // no "thinking" = much faster; models that don't accept the setting get it without
  let r=await send({...cfg,thinkingConfig:{thinkingBudget:0}});
  if(r.status===400){let msg='';try{msg=(await r.clone().json()).error?.message||''}catch(e){}
    if(/think/i.test(msg))r=await send(cfg)}
  return r;
}
async function analyze({img,text}){

  const parts=[];

  let s=line.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,'').replace(/^[\s\-–•*·▪◦►✔✅0-9.)]+/,'');

  if(w.some(x=>/[\u05d0-\u05ea]/.test(x)))w=w.filter(x=>!/^[A-Za-z]{1,2}$/.test(x));   // OCR'd emoji / icons

const isTotal=l=>/סה"כ|סה״כ|סהכ|סך הכל|סך־הכל|בסך הכל|סיכום|total/i.test(l);
function parseNutri(text){
  const lines=String(text).replace(/\r/g,'').split('\n').map(l=>l.replace(/[*#_`>]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  const items=[];let cur=null,total=null,cols=null;
  // nutrition label: values per 100 g
  const full=lines.join(' ');
  if(/ערכים תזונתיים|סימון תזונתי|nutrition facts|100\s*(?:גרם|ג['׳]|g|מ"ל|מ״ל|ml)/i.test(full)&&/אנרגיה|energy|kcal/i.test(full)&&!lines.some(l=>l.includes('|'))){
    const v={};for(const l of lines){const x=nutVals(l);for(const k in x)if(v[k]==null)v[k]=x[k]}
    if(v.kcal!=null||v.protein!=null)return {items:[fin({name:'',grams:100,...v})],label:1};
  }
  for(const l of lines){
    if(l.includes('|')){                         // markdown table
      const c=l.split('|').map(x=>x.trim()).filter((x,i,a)=>!(x===''&&(i===0||i===a.length-1)));
      if(c.every(x=>/^:?-{2,}:?$/.test(x)||x===''))continue;
      const hdr={};c.forEach((x,i)=>{for(const [k,kw] of Object.entries(NUT))if(new RegExp(kw,'i').test(x)&&hdr[k]==null)hdr[k]=i;
        if(/כמות|משקל|גרם|amount|portion|serving/i.test(x)&&hdr.g==null&&!ANYKW.test(x))hdr.g=i});
      if(Object.keys(hdr).some(k=>k!=='g')&&c.filter(x=>/\d/.test(x)).length<2){cols=hdr;continue}
      if(cols){const it={name:c[0].replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,'').trim()};
        for(const k of ['kcal','protein','carbs','fat'])if(cols[k]!=null&&c[cols[k]]){const m=c[cols[k]].match(new RegExp(NUM));if(m)it[k]=toN(m[1],m[2])}
        it.grams=cols.g!=null&&c[cols.g]?gramsOf(c[cols.g]+' ג׳')||toN((c[cols.g].match(/\d+/)||[])[0]):gramsOf(c[0]);
        if(isTotal(l)){total=it;continue}
        if(it.kcal!=null||it.protein!=null)items.push(it);continue}
    }
    const v=nutVals(l),has=Object.keys(v).length>0,nm=cleanName(l),named=nm.length>=2&&!ANYKW.test(nm)&&!isTotal(nm);
    if(isTotal(l)){if(has)total=Object.assign(total||{},v);cur=null;continue}
    if(has){
      if(named){cur={name:nm,grams:gramsOf(l),...v};items.push(cur)}
      else if(cur){for(const k in v)if(cur[k]==null)cur[k]=v[k];if(cur.grams==null)cur.grams=gramsOf(l)}
      else{cur={name:'',grams:gramsOf(l),...v};items.push(cur)}
    }else if(named&&nm.length<=45&&!/[:?]$/.test(l)){cur={name:nm,grams:gramsOf(l)};items.push(cur)}
    else if(cur&&cur.grams==null){const g=gramsOf(l);if(g)cur.grams=g}
  }
  let out=items.filter(x=>x.kcal!=null||x.protein!=null||x.carbs!=null||x.fat!=null);
  if(!out.length&&total)out=[{name:'ארוחה',...total}];
  return {items:out.map(fin),total};
}
function fin(x){
  const p=+x.protein||0,c=+x.carbs||0,f=+x.fat||0;
  const kcal=x.kcal!=null?x.kcal:(p*4+c*4+f*9);
  return {name:x.name||'מאכל',grams:r0(x.grams||100),kcal:r0(kcal),protein:r1(p),carbs:r1(c),fat:r1(f),done:1};
}
let OCRW=null;
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function ocr(file,onp){
  if(!window.Tesseract)await loadScript('ocr/tesseract.min.js');
  if(!OCRW)OCRW=await Tesseract.createWorker(['heb','eng'],1,{workerPath:'ocr/worker.min.js',corePath:'ocr/',langPath:'ocr/lang',gzip:true,
    logger:m=>onp&&onp(m)});

// grayscale, dark screenshots turned light, small ones enlarged — helps the reader
function prepImg(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const sc=im.width<900?2:im.width>2400?.6:1,c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;let sum=0;
    for(let i=0;i<p.length;i+=4){const g=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=p[i+1]=p[i+2]=g;sum+=g}
    if(sum/(p.length/4)<110)for(let i=0;i<p.length;i+=4){p[i]=p[i+1]=p[i+2]=255-p[i]}
    x.putImageData(d,0,0);URL.revokeObjectURL(u);c.toBlob(b=>ok(b),'image/png')};
  im.onerror=()=>{URL.revokeObjectURL(u);bad(new Error('img'))};im.src=u})}

/* ---------- review / edit ---------- */
function openReview(entry,idx){
  cur=entry;curIdx=idx;
  cur.items.forEach(x=>{if(!x.base)x.base={...x}});
  drawReview();open('#shAdd');
}
function drawReview(){
  const e=cur;
  let h=`<h2>${curIdx<0?'בדוק ושמור':'עריכת ארוחה'}</h2>${e.img?`<img class="prev" src="${e.img}" alt="" style="max-height:140px">`:''}
    <div class="chips" id="mc">${MEALS.map(m=>`<button data-m="${m}" class="${m===e.meal?'on':''}">${MEMO[m]} ${m}</button>`).join('')}</div>`;
  e.items.forEach((x,i)=>{
    h+=`<div class="ed" data-i="${i}"><div class="top"><input class="i" data-k="name" value="${esc(x.name)}" placeholder="שם המאכל" style="margin:0">
      <button class="x" data-del="${i}" aria-label="מחק">✕</button></div>
      <div class="gr">כמות <input type="number" inputmode="decimal" data-k="grams" value="${x.grams}"> גרם
      <span class="mut">(משנה את כל הערכים)</span></div>
      <div class="g4">${MAC.map(([k,n])=>`<div><label>${n}</label><input type="number" inputmode="decimal" data-k="${k}" value="${x[k]}"></div>`).join('')}</div></div>`;
  });
  const t=totals([e]);
  h+=`<div class="row" style="margin-top:10px"><button class="btn sec" id="rAdd">+ עוד מאכל</button><button class="btn sec" id="rCalc" style="color:var(--accd)">✨ חשב לפי השמות</button></div>
    <div class="sum"><span>סה״כ</span><span id="rSum">${r0(t.kcal)} קל׳ · ח ${r0(t.protein)} · פ ${r0(t.carbs)} · ש ${r0(t.fat)}</span></div>
    <p class="note">זו הערכה. אם אתה יודע את הכמות המדויקת — תקן את הגרמים.</p>
    <div class="row" style="margin-top:12px">${curIdx>=0?'<button class="btn del" id="rDel">מחק</button>':''}
    <button class="btn sec" id="rC">ביטול</button><button class="btn" id="rOk">שמור ✓</button></div>`;
  $('#addPn').innerHTML=h;
  $('#mc').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;e.meal=b.dataset.m;
    $('#mc').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b))};
  $('#addPn').querySelectorAll('.ed input').forEach(inp=>inp.oninput=()=>{
    const ed=inp.closest('.ed'),x=e.items[+ed.dataset.i],k=inp.dataset.k;
    if(k==='name'){x.name=inp.value;return}
    const v=parseFloat(inp.value);
    if(k==='grams'){x.grams=isNaN(v)?0:v;x.gT=1;const b=x.base;
      if(b&&b.grams>0){const f=x.grams/b.grams;for(const [m] of MAC){x[m]=m==='kcal'?r0(b[m]*f):r1(b[m]*f);
        ed.querySelector(`[data-k="${m}"]`).value=x[m]}}}
    else{x[k]=isNaN(v)?0:v;x.base={...x,base:undefined}}
    const t=totals([e]);$('#rSum').textContent=`${r0(t.kcal)} קל׳ · ח ${r0(t.protein)} · פ ${r0(t.carbs)} · ש ${r0(t.fat)}`;
  });
  $('#addPn').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{e.items.splice(+b.dataset.del,1);drawReview()});
  $('#rAdd').onclick=()=>{e.items.push({name:'',grams:100,kcal:0,protein:0,carbs:0,fat:0});drawReview();
    const all=$('#addPn').querySelectorAll('.ed');all[all.length-1].querySelector('input').focus()};
  $('#rCalc').onclick=async()=>{
    const named=e.items.filter(x=>x.name.trim());
    if(!named.length){toast('כתוב קודם את שם המאכל');return}
    const out=[],ask=[];
    for(const x of e.items){
      if(!x.name.trim()){continue}
      if(x.kcal>0&&!x.gT&&x.base&&x.base.kcal===x.kcal&&x.done){out.push(x);continue}   // already calculated
      const lc=localCalc(x.name,x.gT?x.grams:0);
      if(lc.items.length===1&&!lc.unknown.length){const it=lc.items[0];it.name=x.name.trim();it.done=1;it.base={...it};out.push(it)}
      else ask.push(x);
    }
    if(!ask.length){e.items=out;drawReview();toast('חושב מהמאגר ✓');return}
    const b=$('#rCalc');b.disabled=true;b.textContent='מחשב…';busy=true;const t0=Date.now();
    try{
      const o=await analyze({text:ask.map(x=>`${x.name.trim()}${x.gT&&x.grams>0?` — ${x.grams} גרם`:''}`).join('\n')+
        '\nהשתמש בדיוק בכמויות שכתובות (אם כתובות). אם לא כתובה כמות — מנה רגילה אחת. החזר פריט אחד לכל שורה.'});
      if(closedAt>t0)return;
      busy=false;
      if(!o.items?.length){toast('לא הצלחתי לזהות. נסה שם אחר.');b.disabled=false;b.textContent='✨ חשב שוב';return}
      e.items=out.concat(o.items.map(x=>{const it={name:x.name,grams:r0(x.grams),kcal:r0(x.kcal),protein:r1(x.protein),carbs:r1(x.carbs),fat:r1(x.fat),done:1};it.base={...it};return it}));
      drawReview();toast('חושב ✓ בדוק ושמור');
    }catch(er){if(closedAt>t0)return;busy=false;
      e.items=out.concat(ask);drawReview();
      toast((ERR[er.code]||ERR.srv).slice(0,70)+(out.length?' (מה שבמאגר חושב)':''));
      if(DIAG.last)$('#addPn').insertAdjacentHTML('beforeend',`<div class="err" dir="ltr" style="text-align:left">${esc(DIAG.last)}</div>`)}
  };
  $('#rC').onclick=()=>close('#shAdd');
  if($('#rDel'))$('#rDel').onclick=()=>{if(!confirm('למחוק את הארוחה?'))return;DB[day].splice(curIdx,1);if(!DB[day].length)delete DB[day];save();close('#shAdd');render()};
  $('#rOk').onclick=()=>{
    e.items=e.items.filter(x=>x.name.trim()||x.kcal>0).map(x=>{const o={...x};delete o.base;delete o.gT;delete o.done;o.name=o.name.trim()||'מאכל';return o});
    if(!e.items.length){toast('אין מה לשמור');return}
    if(curIdx<0){e.time=new Date().toTimeString().slice(0,5);e.id=Date.now();(DB[day]=DB[day]||[]).push(e)}
    else DB[day][curIdx]=e;
    e.items.forEach(learn);saveMy();addMeal=null;BASK=[];
    save();close('#shAdd');render();toast('נשמר ✓');
  };
}

/* ---------- onboarding: name → body → activity + goal → targets → AI key ---------- */
const ACT=[[1.2,'כמעט בלי תנועה','עבודה מול מחשב, מעט הליכה'],[1.375,'קצת פעיל','אימון 1-3 פעמים בשבוע'],[1.55,'פעיל','אימון 3-5 פעמים בשבוע'],[1.725,'מאוד פעיל','אימון כמעט כל יום'],[1.9,'ספורטאי','אימונים קשים / עבודה פיזית']];
const GOALS=[['lose','לרדת במשקל','גירעון של כ-500 קל׳ ביום (≈ ½ ק״ג בשבוע)',-500],['keep','לשמור על המשקל','',0],['gain','לעלות במסה','עודף של כ-300 קל׳ ביום',300]];
let OB=null;
function calcGoal(o){
  const b=10*o.w+6.25*o.h-5*o.age+(o.sex==='f'?-161:5),tdee=b*o.act,gl=GOALS.find(x=>x[0]===o.goal)||GOALS[1];
  const kcal=Math.max(Math.round(b*1.05/50)*50,Math.round((tdee+gl[3])/50)*50);
  const protein=Math.round(o.w*(o.goal==='keep'?1.6:1.8)),fat=Math.round(kcal*.28/9),carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,carbs,fat,tdee:Math.round(tdee)};
}
function openOnb(step){
  OB=OB||{name:S.name||'',sex:S.prof.sex||'m',age:S.prof.age||'',h:S.prof.h||'',w:S.prof.w||'',act:S.act||1.375,goal:S.goalType||'lose',key:S.key||''};

}

  const list=Object.entries(MY).sort((a,b)=>b[1].n-a[1].n||a[1].name.localeCompare(b[1].name));
  $('#histPn').innerHTML=`<h2>⭐ המאגר שלי</h2>
    <p class="note">כל מה שאתה שומר נזכר כאן. בפעם הבאה שתכתוב את אותו שם — החישוב מיידי, בלי גוגל. כדי לתקן ערכים: פשוט ערוך ושמור את המאכל ביומן.</p>
    ${list.length?`<table class="h"><tr><th>מאכל</th><th>מנה</th><th>קל׳</th><th>פעמים</th><th></th></tr>
    ${list.map(([k,o])=>`<tr><td>${esc(o.name)}</td><td>${o.unit} ג׳</td><td>${r0(o.kcal*o.unit/100)}</td><td>${o.n}</td>
      <td><button class="x" data-k="${esc(k)}" style="border:0;background:none;color:var(--warn);font-size:1.1rem">✕</button></td></tr>`).join('')}</table>`
      :'<div class="empty">עוד ריק. כל מאכל שתשמור ייכנס לכאן.</div>'}
    <button class="btn" id="myC" style="width:100%;margin-top:14px">סגור</button>`;
  open('#shHist');
  $('#myC').onclick=()=>close('#shHist');
  $('#histPn').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{delete MY[b.dataset.k];saveMy();openMy()});
}
function download(name,text,type){
  const blob=new Blob([text],{type});const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  let rows=[['תאריך','שעה','ארוחה','מאכל','גרם','קלוריות','חלבון','פחמימות','שומן']];
  for(const d of Object.keys(DB).sort())for(const e of DB[d])for(const x of e.items)
    rows.push([d,e.time||'',e.meal,x.name,x.grams,x.kcal,x.protein,x.carbs,x.fat]);
  download('kalori-'+dk(new Date())+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

/* ---------- history ---------- */
$('#bHist').onclick=()=>{
  const g=S.goal,days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dk(d))}
  const tt=days.map(d=>totals(DB[d]));const mx=Math.max(g.kcal*1.2,...tt.map(t=>t.kcal));
  const last7=tt.slice(-7).filter(t=>t.kcal>0);const avg=k=>last7.length?r0(last7.reduce((s,t)=>s+t[k],0)/last7.length):0;
  const dfOf=(d,t)=>{const b=burnOf(d);return b&&!b.noRest&&t.kcal>0?b.tot-t.kcal:null};
  const w7=days.slice(-7).map((d,i)=>dfOf(d,tt[7+i])).filter(x=>x!=null),wSum=w7.reduce((s,x)=>s+x,0);
  $('#histPn').innerHTML=`<h2>📊 14 ימים אחרונים</h2>
    <div class="wk">${days.map((d,i)=>`<div><i class="${tt[i].kcal>g.kcal?'ov':''}" style="height:${tt[i].kcal/mx*100}%"></i>${+d.slice(8)}</div>`).join('')}</div>
    <p class="mut">ממוצע ב-7 הימים האחרונים (ימים עם רישום): <b>${avg('kcal')}</b> קל׳ · ח ${avg('protein')} · פ ${avg('carbs')} · ש ${avg('fat')}</p>
    ${w7.length?`<div class="sum" style="background:${wSum>=0?'var(--acc2)':'rgba(220,38,38,.1)'};color:${wSum>=0?'var(--acc)':'var(--warn)'}">
      <span>${wSum>=0?'גירעון':'עודף'} ב-7 ימים (${w7.length} ימים עם נתונים)</span><span>${r0(Math.abs(wSum))} קל׳ ≈ ${(Math.abs(wSum)/7700).toFixed(2)} ק״ג</span></div>`:''}
    <table class="h" style="margin-top:10px"><tr><th>יום</th><th>אכלת</th><th>שרפת</th><th>גירעון</th><th>ח/פ/ש</th></tr>
    ${days.slice().reverse().map((d,i)=>{const t=tt[13-i],b=burnOf(d),df=dfOf(d,t);return t.kcal||FIT[d]?`<tr data-d="${d}"><td>${new Date(d+'T12:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</td>
      <td style="color:${t.kcal>g.kcal?'var(--warn)':''}">${r0(t.kcal)}</td><td>${b&&!b.noRest?r0(b.tot):'–'}</td>
      <td style="color:${df==null?'':df>=0?'var(--acc)':'var(--warn)'}">${df==null?'–':(df<0?'+':'')+r0(Math.abs(df))}</td>
      <td class="mut">${r0(t.protein)}/${r0(t.carbs)}/${r0(t.fat)}</td></tr>`:''}).join('')}</table>
    <p class="note">גירעון ירוק = אכלת פחות ממה ששרפת. +אדום = עודף. בערך 7,700 קל׳ = ק״ג אחד. זו הערכה.</p>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="hCsv">📄 ייצא טבלה</button><button class="btn" id="hC">סגור</button></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='bHist'));
  open('#shHist');
  $('#histPn').querySelectorAll('tr[data-d]').forEach(tr=>tr.onclick=()=>{day=tr.dataset.d;close('#shHist');render()});
  $('#hC').onclick=()=>close('#shHist');$('#hCsv').onclick=exportCsv;
};

/* ---------- no zoom at all: pinch, double tap, input focus ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();
  if(n-lastTouch<350&&!e.target.closest('input,textarea,select')){e.preventDefault();e.target.click&&e.target.closest('button,a,.it,tr,[data-d]')&&e.target.click()}
  lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

/* ---------- start ---------- */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if(!S.onb&&(Object.keys(DB).length||S.key))S.onb=1;   // existing users skip the welcome
render();
if(!S.onb)setTimeout(()=>openOnb(0),300);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
