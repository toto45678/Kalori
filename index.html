<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>קלוריות</title>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0c100e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קלוריות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--btn:#027a48;--bg:#f4f5f7;--card:#fff;--ink:#101828;--mut:#667085;--line:#eaecf0;--soft:#f2f4f7;
 --acc:#12b76a;--accd:#027a48;--acc2:#e3f8ee;--warn:#f04438;--warn2:#fef3f2;
 --kc:#12b76a;--pr:#2e90fa;--cb:#f79009;--ft:#ee46bc;--r:22px;
 --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c100e;--card:#161b19;--ink:#eef2f0;--mut:#98a2a0;--line:#252c29;--soft:#1e2421;
 --acc2:#123323;--warn2:#3a1514;--accd:#32d583;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,background-color .15s,opacity .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.55}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:.86rem}
a{color:var(--acc)}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 0}
.top .hi{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.top .dt{color:var(--mut);font-size:.9rem}
.av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,#32d583,#12b76a);color:#fff;font-weight:700;font-size:1.1rem;box-shadow:0 4px 12px rgba(18,183,106,.3)}
/* week strip */
.week{display:flex;align-items:center;gap:4px;margin-top:14px}
.week .wa{flex:none;width:28px;height:52px;border:0;background:none;color:var(--mut);font-size:1.3rem}
.week .wa[hidden]{visibility:hidden;display:block}
.week .d{flex:1;min-width:0;border:0;background:var(--card);border-radius:16px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--sh);font-size:.72rem;color:var(--mut)}
.week .d b{font-size:.95rem;color:var(--ink);font-weight:600}
.week .d svg{display:block}
.week .d.sel{background:var(--ink);color:var(--card)}
.week .d.sel b{color:var(--card)}
.week .d.fut{opacity:.4;pointer-events:none}
/* hero */
.hero{padding:18px 14px 16px}
.heroRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.stat{text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:700}
.stat span{color:var(--mut);font-size:.8rem}
.ringW{position:relative;width:164px;height:164px}
.ringW svg{position:absolute;inset:0}
.ringW .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringW .rc b{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.ringW .rc span{color:var(--mut);font-size:.85rem;margin-top:4px}
#ringC{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.mac .n{font-size:.8rem;color:var(--mut)}
.mac .tr{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;margin:5px 0 4px}
.mac .fi{height:100%;border-radius:7px;transition:width .6s}
.mac .v{font-size:.82rem;font-weight:600}
.mac .v span{color:var(--mut);font-weight:400}
/* deficit card */
.burnC{display:flex;align-items:center;gap:12px;padding:14px 16px}
.burnC .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:var(--soft)}
.burnC .tx{flex:1;min-width:0}
.burnC .tx b{display:block;font-size:1.05rem}
.burnC .tx b.ok{color:var(--acc)}
.burnC .tx b.bad{color:var(--warn)}
.burnC .bt{display:flex;gap:6px;flex:none}
.pill{border:0;background:var(--soft);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.g{background:var(--acc2);color:var(--accd)}
.setup{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ecfdf3,#d1fadf);border:0;width:100%;text-align:right;color:#05603a}
@media (prefers-color-scheme:dark){.setup{background:linear-gradient(135deg,#123323,#0c2a1c);color:#a6f4c5}}
/* meals */
.meal{padding:14px 16px 8px}
.meal .mh{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.meal .mh .e{font-size:1.25rem}
.meal .mh h3{margin:0;font-size:1.02rem;flex:1}
.meal .mh .k{color:var(--mut);font-size:.88rem}
.add{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--acc2);color:var(--accd);display:grid;place-items:center;flex:none}
.meal .none{color:var(--mut);font-size:.86rem;padding:2px 0 10px}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.it img{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
.it .ph{width:48px;height:48px;border-radius:14px;flex:none;background:var(--soft);display:grid;place-items:center;font-size:1.3rem}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .kc{font-weight:700;white-space:nowrap}
.it .kc small{font-weight:400;color:var(--mut);font-size:.75rem}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:flex-end;
  background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs{}@media (prefers-color-scheme:dark){.tabs{background:rgba(22,27,25,.9)}}
.tabs button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--mut);padding:4px 0;white-space:nowrap}
.tabs button i{font-style:normal}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on i{color:var(--accd)}
.tabs .cam{color:var(--accd);font-weight:600}
.tabs .cam i{width:60px;height:60px;margin-top:-28px;border-radius:50%;background:linear-gradient(135deg,#32d583,#12b76a);display:grid;place-items:center;font-size:1.55rem;
  box-shadow:0 8px 20px rgba(18,183,106,.4);border:4px solid var(--bg);color:#fff}
/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--btn);color:#fff;box-shadow:0 2px 8px rgba(2,122,72,.25);min-height:46px}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.del{background:var(--warn2);color:var(--warn);box-shadow:none}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
label.f{display:block;margin-top:12px;font-size:.86rem;color:var(--mut)}
input.i,select.i,textarea.i{width:100%;margin-top:5px;padding:12px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--soft);outline:none}
input.i:focus,textarea.i:focus{border-color:var(--acc);background:var(--card)}
textarea.i{min-height:84px;resize:vertical}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:fd .2s}
.sheet.on .pn{animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes fd{from{background:rgba(16,24,40,0)}}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet .pn{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .pn:before{content:"";display:block;width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 8px}
.sheet h2{margin:2px 0 8px;font-size:1.2rem;padding-left:44px;letter-spacing:-.01em}
.sheet h3.sub{margin:18px 0 6px;font-size:.95rem}
.shx{position:sticky;top:0;float:left;z-index:3;width:40px;height:40px;margin:-2px 0 0 -4px;border-radius:50%;border:0;background:var(--soft);font-size:.95rem;color:var(--mut);display:grid;place-items:center}
.full .pn{max-height:100vh;height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
.full .pn:before{display:none}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:18px;display:block}
.ed{background:var(--soft);border-radius:18px;padding:12px;margin-top:10px}
.ed .top{display:flex;gap:8px;align-items:center;padding:0}
.ed .top input{flex:1;background:var(--card)}
.ed .x{border:0;background:none;color:var(--warn);font-size:1.2rem;padding:4px 8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.g4 label{font-size:.74rem;color:var(--mut)}
.g4 input{width:100%;padding:9px 4px;border-radius:12px;border:0;background:var(--card);text-align:center;outline:none}
.gr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.88rem}
.gr input{width:90px;padding:9px;border-radius:12px;border:0;background:var(--card);text-align:center;outline:none}
.sum{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--acc2);color:var(--accd)}
.load{text-align:center;padding:34px 0;color:var(--mut)}
.spin{width:44px;height:44px;border:4px solid var(--soft);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--warn);background:var(--warn2);padding:12px 14px;border-radius:14px;margin-top:10px;font-size:.92rem}
.note{font-size:.84rem;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:.9rem}
.chips button.on{background:var(--ink);color:var(--card)}
table.h{width:100%;border-collapse:collapse;font-size:.88rem}
table.h th{font-weight:500;color:var(--mut);font-size:.78rem}
table.h th,table.h td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center}
table.h td:first-child,table.h th:first-child{text-align:right}
.wk{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:12px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;color:var(--mut);height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#32d583,#12b76a);min-height:3px}
.wk i.ov{background:linear-gradient(180deg,#f97066,#f04438)}
.steps{padding-inline-start:20px;margin:6px 0}
.steps li{margin:4px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sel{display:flex;gap:6px;margin-top:6px}
.sel button{flex:1;border:0;background:var(--soft);border-radius:14px;padding:11px 6px;font-size:.92rem}
.sel button.on{background:var(--ink);color:var(--card);font-weight:600}
ol.sc{padding-inline-start:22px;margin:8px 0}
ol.sc li{margin:7px 0;font-size:.93rem}
code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:.88rem;direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:14px;z-index:20;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.svg{display:block;flex:none}
.mi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--mb);color:var(--mf);flex:none}
@media (prefers-color-scheme:dark){.mi{background:color-mix(in srgb,var(--mf) 22%,transparent)}.onb .hero2,.tile i{filter:saturate(1.1)}}
.it .ph{background:none}
.it .ph .mi{width:48px;height:48px;border-radius:14px}
.burnC .ic.fl{background:#fff4ed;color:#ec4a0a}.burnC .ic.wr{background:var(--warn2);color:var(--warn)}.burnC .ic.wt{background:#e0f2fe;color:#0086c9}
@media (prefers-color-scheme:dark){.burnC .ic.fl{background:#3a1d0e}.burnC .ic.wt{background:#0b2a3d}}
.pill{display:inline-flex;align-items:center;gap:5px}
.pill.ib2{padding:8px 10px;color:var(--mut)}
.chips button{display:inline-flex;align-items:center;gap:6px}
.tile i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tb);color:var(--tf);margin-bottom:6px}
h3.sub{display:flex;align-items:center;gap:6px}
.fr .nm b{display:flex;align-items:center;gap:6px}
.grp .li i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--card);color:var(--accd)}
.tabs button i{display:grid;place-items:center;height:30px}
.stk{display:inline-block;font-size:.8rem;font-weight:600;background:#fff4ed;color:#ec4a0a;border-radius:999px;padding:2px 9px;vertical-align:middle}
@media (prefers-color-scheme:dark){.stk{background:#3a1d0e}}
.wq{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:right;padding:12px 14px}
.wq .tx{flex:1;min-width:0}.wq .tx b{display:block}.wq .tx span{font-size:.82rem;color:var(--mut)}
.wk2{padding:12px 16px}.wk2 .r1{display:flex;justify-content:space-between;align-items:baseline}.wk2 b.bad{color:var(--warn)}
.wk2 .tr,.pc .tr{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.wk2 .fi,.pc .fi{height:100%;border-radius:8px;background:linear-gradient(90deg,#32d583,#12b76a);transition:width .6s}
.pc .tr.big{height:12px}
.pq{padding:12px 16px}.pq .r1{display:flex;align-items:center;gap:8px;color:var(--pr)}.pq .r1 b{color:var(--ink)}
.pq .chips button{font-size:.85rem;padding:7px 11px}
.warnC{display:flex;gap:10px;align-items:flex-start;background:var(--warn2);color:var(--warn);font-size:.88rem;padding:12px 14px}
.wbig{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.wbig input{width:150px;text-align:center;font-size:2.2rem!important;font-weight:700;padding:10px}
.wbig .add{width:52px;height:52px;font-size:1.6rem}
.pc{padding:14px 16px}.pc .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc .r2{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut)}
.big3{font-size:2rem;font-weight:800;line-height:1.15;letter-spacing:-.02em}.big3 small{font-size:.9rem;font-weight:500;color:var(--mut)}
.wch{width:100%;height:180px;display:block;margin-top:8px;direction:ltr}
.wch .gl{stroke:var(--line);stroke-width:1}.wch .gt{font-size:9px;fill:var(--mut);font-family:inherit}
.wch .tg{stroke:#12b76a;stroke-width:1.2;stroke-dasharray:4 4}.wch .tgt{fill:#039855;font-weight:600}
.wch .tl{fill:none;stroke:#12b76a;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.wch .pj{fill:none;stroke:#12b76a;stroke-width:2;stroke-dasharray:3 4;opacity:.6}
.wch .dt{fill:var(--card);stroke:#2e90fa;stroke-width:1.6}
.leg{display:flex;gap:14px;font-size:.75rem;color:var(--mut);margin-top:4px}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}
.leg .l1{background:#12b76a}.leg .l2{background:#2e90fa;height:6px;width:6px;border-radius:50%}.leg .l3{background:repeating-linear-gradient(90deg,#12b76a 0 3px,transparent 3px 6px)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sgrid div{background:var(--soft);border-radius:16px;padding:12px}.sgrid b{display:block;font-size:1.3rem}.sgrid span{font-size:.78rem;color:var(--mut)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:11px 12px;margin-top:8px;font-size:.9rem}
.tip .svg{color:var(--accd);margin-top:2px}
.mlist{margin-top:8px}.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow img,.mrow .mi{width:52px;height:52px;border-radius:14px;object-fit:cover}.mrow b{display:block}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rrow:last-child{border-bottom:0}
.rrow span{flex:1}.rrow input[type=checkbox]{width:22px;height:22px;accent-color:#12b76a}.rrow .i{width:120px;margin:0;background:var(--card)}
.woC{padding:12px 16px 6px}.woC .wh{display:flex;align-items:center;gap:10px;padding-bottom:6px}.woC .wh b{flex:1}.woC .wh .k{color:var(--mut);font-size:.88rem}
.woC .none{color:var(--mut);font-size:.86rem;padding:2px 0 8px}
.wr2{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.qty .chips button.on{background:var(--ink);color:var(--card)}
.okf{animation:okf 1.1s}@keyframes okf{0%{background:var(--acc2)}100%{background:transparent}}
.burnC .tx b.neu{color:var(--ink)}
.tip.tw{background:var(--warn2);color:var(--warn)}.tip.tw .svg{color:var(--warn)}
.tip .pill{margin-top:6px}
.stickyF{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));margin:12px -18px calc(-22px - env(safe-area-inset-bottom));padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast button{border:0;background:none;color:#6ce9a6;font-weight:700;padding:6px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bakC{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:.86rem}.bakC .svg{color:var(--accd);flex:none}.bakC .btn{padding:8px 14px;min-height:0;flex:none}
.paks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.pak{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pak b{font-size:2rem;line-height:1}.pak span{color:var(--mut);font-size:.85rem}.pak em{font-style:normal;margin-top:8px;background:var(--btn);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600}
details summary{cursor:pointer}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:cf 2.2s ease-in forwards}
@keyframes cf{to{top:105%;transform:rotate(540deg) translateX(40px)}}
.hero .macros{display:grid;grid-template-columns:1fr;gap:9px;margin-top:16px}

.chip2 b{color:var(--ink)}.chip2 .svg{color:var(--accd);flex:none}.chip2.bad b,.chip2.bad .svg{color:var(--warn)}.chip2.ok .svg{color:var(--accd)}
.mi.im{background:var(--mb);padding:3px}.mi.im img{width:100%;height:100%;object-fit:contain;display:block}
@media (prefers-color-scheme:dark){.mi.im{background:rgba(255,255,255,.06)}}

.meal.emp{padding:10px 16px}.meal.emp .mh{padding:0}.meal .mh .k{font-size:.8rem}
.meal .mh h3{font-weight:600}
.woC.emp{padding:10px 16px}.woC.emp .wh{padding:0}
.onb .hero2.img{background:none;width:150px;height:150px;border-radius:0}.onb .hero2.img img{width:100%;height:100%;object-fit:contain}

.srch{position:relative;margin-top:6px}

.srch>i{position:absolute;right:14px;top:50%;transform:translateY(-38%);color:var(--mut);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}

.fr{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.fr .nm{flex:1;min-width:0}
.fr .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bask .t{flex:1;font-size:.9rem}

/* onboarding */
.onb{display:flex;flex-direction:column;min-height:100%}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:4px 0 18px}

.onb .hero2{width:96px;height:96px;border-radius:32px;margin:18px auto 14px;display:grid;place-items:center;background:var(--hb);color:var(--hf)}
.onb h1{font-size:1.6rem;text-align:center;margin:0 0 6px;letter-spacing:-.02em}
.onb p.lead{text-align:center;color:var(--mut);margin:0 0 18px}
.onb .grow{flex:1}
.opt{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.opt button b{font-weight:600}
.opt button span{color:var(--mut);font-size:.8rem;display:block}
.opt button.on{border-color:var(--acc);background:var(--acc2)}
.goalbox{background:var(--soft);border-radius:20px;padding:16px;text-align:center;margin-top:8px}

/* settings list */

.grp .li .t span{display:block;font-size:.78rem;color:var(--mut)}
.grp .li:after{content:"‹";color:var(--mut);font-size:1.2rem}

<body>
<div class="wrap">

</div>

<!-- add / review -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0);
const r1=n=>Math.round((+n||0)*10)/10;
const MAC=[['kcal','קלוריות','var(--kc)'],['protein','חלבון','var(--pr)'],['carbs','פחמימות','var(--cb)'],['fat','שומן','var(--ft)']];
const MEALS=['בוקר','צהריים','ערב','נשנוש'];

/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){let j;try{j=JSON.stringify(v);localStorage.setItem(k,j)}catch(e){
      if(k!=='kal-db'&&k!=='kal-models2')setTimeout(()=>toast('⚠️ השמירה נכשלה — האחסון מלא. שמור גיבוי בהגדרות'),0);return false}
    const P=window.__PREF;if(P&&k.startsWith('kal-'))P.set({key:k,value:j}).catch(()=>{});   // native: durable copy that iOS does not clear
    return true}};
let S=LS.get('kal-set',{key:'',goal:{kcal:2000,protein:120,carbs:220,fat:65}});
S.prof=S.prof||{sex:'m',age:0,h:0,w:0};S.goal=S.goal||{kcal:2000,protein:120,carbs:220,fat:65};S.sc=S.sc||'קלוריות כושר';
let DB=LS.get('kal-db',{});            // {'2026-11-23':[entry,...]}
let WO=LS.get('kal-wo',{});         // {'2026-11-25':[{type,min,lvl,kcal,src,time}]} workouts typed by hand
let FIT=LS.get('kal-fit',{});          // {'2026-11-23':{act,rest,t}}  burned kcal from Apple Health (via Shortcuts) or typed
function save(){
  if(LS.set('kal-db',DB))return;
  // storage full: drop the oldest photos and retry
  const days=Object.keys(DB).sort();
  for(const d of days){for(const e of DB[d])if(e.img){delete e.img;if(LS.set('kal-db',DB))return}}
  toast('האחסון מלא');
}
const dk=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
let day=dk(new Date());

/* ---------- totals ---------- */
function totals(list){const t={kcal:0,protein:0,carbs:0,fat:0};
  for(const e of list||[])for(const it of e.items)for(const k in t)t[k]+=+it[k]||0;return t}

/* ---------- burned calories / deficit ---------- */
function bmr(){const p=S.prof;if(!(p.age>0&&p.h>0&&p.w>0))return 0;return 10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5)}
function dayFrac(){const n=new Date();return (n.getHours()*60+n.getMinutes())/1440}
// {rest,act,tot,restEst} or null when nothing is known about that day
function woKcal(d){return (WO[d]||[]).reduce((s,w)=>s+(+w.kcal||0),0)}
function woExtra(d){return (WO[d]||[]).reduce((s,w)=>s+(w.extra===false?0:(+w.kcal||0)),0)}   // what the watch did not measure
function burnOf(d){
  const f=FIT[d],today=d===dk(new Date()),b=bmr(),wk=woExtra(d);
  if(f&&f.tot>0)return {rest:0,act:f.tot+wk,tot:f.tot+wk,wo:wk,restEst:false,noRest:false,t:f.t,total:1};   // the watch's total (active + resting): no estimate on top
  let rest=f&&f.rest>0?f.rest:null,act=(f?(+f.act||0):0)+wk,restEst=false;
  if(rest==null&&b){rest=today?b*dayFrac():b;restEst=true}
  if(rest==null&&!f&&!wk)return null;
  return {rest:rest||0,act,tot:(rest||0)+act,wo:wk,restEst,noRest:rest==null,t:f&&f.t};
}
// the daily deficit uses ONE source: the learned burn (weight trend + log) when known, else the formula; the watch is shown, not counted twice
function baseBurn(){const t=planTarget();return t?t.tdee:(formulaTdee()||null)}
function dayDeficit(d,eaten){const b=baseBurn();if(b==null){const x=burnOf(d);return x&&!x.noRest?x.tot-eaten:null}return b+woExtra(d)-eaten}
function renderBurn(t){
  const base=baseBurn();
  if(base!=null){
    const el=$('#burn'),today=day===dk(new Date()),hr=new Date().getHours(),fin=!today||hr>=20,wk=woExtra(day),bu=burnOf(day);
    const df=fin?base+wk-t.kcal:base+wk-S.goal.kcal,hot=fin&&(df>1000||(t.kcal>0&&t.kcal<minKcal()*.8)),over=df<0;
    $('#heroDef').innerHTML=`<div class="hdef ${hot||over?'bad':''}">
        <div class="t1"><span>${fin?(over?'עודף היום':'גירעון היום'):'גירעון צפוי'}</span><b>≈ ${r0(Math.abs(df)).toLocaleString()} קל׳</b>
          ${today?`<button class="ib3" id="bSync" aria-label="סנכרן שריפה מהשעון">${ic('watch',18)}</button>`:''}<button class="ib3" id="bFitMan" aria-label="הזן שריפה ידנית">${ic('pencil',17)}</button></div>
        <div class="t2">${hot?(df>1000?'מהר מדי לירידה מבוקרת — כדאי לאכול קצת יותר':'אכלת מעט מאוד היום'):`הגוף שורף ≈ ${r0(base).toLocaleString()}${wk?` + אימונים ${r0(wk)}`:''}${bu&&(bu.t||bu.total)?` · השעון ${r0(bu.tot).toLocaleString()}`:''}`}</div></div>`;
    el.innerHTML='';renderWoCard(el);
    if($('#bSync'))$('#bSync').onclick=syncFit;$('#bFitMan').onclick=()=>openFitSheet(false);
    return;
  }
  $('#heroDef').innerHTML='';renderBurnOld(t);
}
function renderBurnOld(t){
  const el=$('#burn'),bu=burnOf(day),today=day===dk(new Date());
  if(bu&&!bu.noRest){
    const df=bu.tot-t.kcal;
    el.innerHTML=`<div class="card burnC"><div class="ic ${df>=0?'fl':'wr'}">${ic(df>=0?'flame':'warn',24)}</div>
      <div class="tx"><span class="mut">${df>=0?'גירעון':'עודף'}${today?' עד עכשיו':''}</span><b class="${df>=0?'ok':'bad'}">${r0(Math.abs(df)).toLocaleString()} קל׳</b>
      <span class="mut">שרפת ${r0(bu.tot).toLocaleString()}${bu.wo?` (כולל אימונים ${r0(bu.wo)})`:bu.total?' (סה״כ מהשעון)':bu.restEst?' (מנוחה בחישוב)':''}${bu.t?' · עודכן '+bu.t:''}</span></div>
      <div class="bt">${today?`<button class="pill g" id="bSync">${ic('watch',17)} סנכרן</button>`:''}<button class="pill ib2" id="bFitMan" aria-label="הזן ידנית">${ic('pencil',17)}</button></div></div>`;
  }else{
    el.innerHTML=`<div class="card burnC"><div class="ic wt">${ic('watch',24)}</div>
      <div class="tx"><b style="font-size:.95rem">כמה שרפת היום?</b><span class="mut">${bu&&bu.noRest?'פעילות '+r0(bu.act)+' · הוסף פרופיל לחישוב גירעון':'חבר את השעון כדי לראות גירעון'}</span></div>
      <div class="bt">${today?'<button class="pill g" id="bSync">חבר</button>':''}<button class="pill ib2" id="bFitMan" aria-label="הזן ידנית">${ic('pencil',17)}</button></div></div>`;
  }
  renderWoCard(el);
}
function renderWoCard(el){
  const ws=WO[day]||[];
  el.innerHTML+=`<div class="card woC ${ws.length?'':'emp'}"><div class="wh"><span class="mi im" style="--mb:#dcfae6">${art('i_shoe','')}</span><b>אימונים</b>
    <span class="k">${ws.length?r0(woKcal(day))+' קל׳':''}</span><button class="add" id="bWo" aria-label="הוסף אימון">${ic('plus',18,2.4)}</button></div>
    ${ws.length?ws.map((w,i)=>`<div class="wr2" data-wo="${i}"><span>${esc(w.type)}${w.min?` · ${w.min} דק׳`:''}${w.extra===false?' <small class="mut">(נמדד בשעון)</small>':''}</span><b>${r0(w.kcal)}</b></div>`).join(''):''}</div>`;
  if($('#bSync'))$('#bSync').onclick=syncFit;
  $('#bFitMan').onclick=()=>openFitSheet(false);
  $('#bWo').onclick=()=>openWorkout(-1);
  el.querySelectorAll('[data-wo]').forEach(r=>r.onclick=()=>openWorkout(+r.dataset.wo));
}
/* ---------- manual workouts: type + minutes + effort → estimated kcal (net, above resting), or the device's number ---------- */
const WOT=[['הליכה',[2.8,3.5,5]],['ריצה',[7,9.8,11.5]],['אופניים',[5.5,7.5,10]],['שחייה',[5.8,7,9.8]],['חדר כושר',[3.5,5,6]],['HIIT / קרוספיט',[6,8,10]],
  ['יוגה / פילאטיס',[2.5,3,4]],['משחק כדור',[5,7,9]],['ריקוד',[4,5,7]],['טניס / פאדל',[5,7,8]],['טיפוס / הליכה בשטח',[5,6.5,8]],['אחר',[3.5,5,7]]];
function woEst(type,min,lvl){const t=WOT.find(x=>x[0]===type)||WOT[WOT.length-1],met=t[1][lvl??1],w=curWeight?curWeight()||S.prof.w||75:S.prof.w||75;
  return Math.max(0,Math.round((met-1)*w*(+min||0)/60))}
function openWorkout(i){
  const cur0=i>=0?(WO[day]||[])[i]:null,o=cur0?{...cur0}:{type:'הליכה',min:30,lvl:1,kcal:null,src:'est',extra:!FIT[day]};
  $('#addPn').innerHTML=`<h2>${cur0?'עריכת אימון':'אימון'}</h2>
    <div class="chips" id="woT">${WOT.map(t=>`<button data-t="${esc(t[0])}" class="${t[0]===o.type?'on':''}">${esc(t[0])}</button>`).join('')}</div>
    <div class="g2" style="margin-top:12px">
      <label class="f" style="margin:0">משך (דקות)<input class="i" id="woM" type="number" inputmode="numeric" value="${o.min||''}"></label>
      <div><div class="f" style="margin:0">עצימות</div><div class="sel" id="woL">${['קלה','בינונית','גבוהה'].map((n,k)=>`<button data-l="${k}" class="${k===(o.lvl??1)?'on':''}">${n}</button>`).join('')}</div></div></div>
    <label class="f">קלוריות שנשרפו<input class="i" id="woK" type="number" inputmode="numeric" value="${o.kcal??''}" placeholder=""></label>
    <div class="note" id="woN"></div>
    <label class="rrow" style="border:0"><input type="checkbox" id="woX" ${o.extra!==false?'checked':''}><span>השעון <b>לא</b> מדד את האימון הזה — להוסיף לשריפה</span></label>
    <div class="row" style="margin-top:12px">${cur0?'<button class="btn del" id="woDel">מחק</button>':''}<button class="btn" id="woOk">שמור</button></div>`;
  open('#shAdd');
  let typed=o.src==='dev';
  const upd=()=>{const e=woEst(o.type,$('#woM').value,o.lvl);$('#woN').textContent=`הערכה: ≈ ${e} קל׳ מעבר למנוחה${typed?' · נכתב ידנית: '+($('#woK').value||0):''}`;
    if(!typed)$('#woK').value=e};
  const pick=(id,fn)=>{$(id).onclick=ev=>{const b=ev.target.closest('button');if(!b)return;$(id).querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b));fn(b);upd()}};
  pick('#woT',b=>o.type=b.dataset.t);pick('#woL',b=>o.lvl=+b.dataset.l);
  $('#woM').oninput=upd;$('#woK').oninput=()=>{typed=$('#woK').value!=='';upd()};
  upd();
  $('#woOk').onclick=()=>{const k=num($('#woK').value),m=+$('#woM').value||0;if(!(k>0)){toast('כמה קלוריות?');return}
    const w={type:o.type,min:m,lvl:o.lvl,kcal:Math.round(k),src:typed?'dev':'est',extra:$('#woX').checked,time:o.time||new Date().toTimeString().slice(0,5)};

function num(s){

  if(s.includes('.')&&s.includes(','))s=s.replace(/,/g,'');

  else s=s.replace(',','.');
  return parseFloat(s);
}

function sumNums(t){const m=String(t).match(/\d[\d,]*(?:\.\d+)?/g)||[];return m.length?m.reduce((s,x)=>s+(num(x)||0),0):NaN}
function parseFit(txt){

  txt=txt.replace(/(\d)[\u00a0\u202f\u2009 ](?=\d{3}(?!\d))/g,'$1');   // '1 234' = 1234
  let d=(txt.match(/\d{4}-\d{2}-\d{2}/)||[])[0]||dk(new Date());txt=txt.replace(/\d{4}-\d{2}-\d{2}/g,' ');
  let act,rest;
  const k=txt.search(/KALFIT/i);
  if(k>=0){const parts=txt.slice(k+6).split(';').filter((x,i)=>i>0||x.trim());const p=parts.length&&!parts[0].trim()?parts.slice(1):parts;
    act=sumNums(p[0]||'');rest=sumNums(p[1]||'')}
  else{const n=(txt.match(/\d[\d,]*(?:\.\d+)?/g)||[]).map(num).filter(x=>!isNaN(x));
    if(!n.length)return null;
    if(n.length>2||/kcal|cal|קל|קק/i.test(txt)){act=n.reduce((a,x)=>a+x,0);rest=NaN}   // shortcut copied the Active Calories samples straight to the clipboard
    else{act=n[0];rest=n.length>1?n[1]:NaN}}
  if(isNaN(act)&&isNaN(rest))return null;
  if((act||0)>6000||(rest||0)>6000)return null;   // not calories
  return {d,act:isNaN(act)?0:act,rest:isNaN(rest)?0:rest};
}

function toast(t,o){const el=$('#toast');el.innerHTML='';const sp=document.createElement('span');sp.textContent=t;el.appendChild(sp);
  el.classList.toggle('act',!!(o&&o.undo));el.dataset.keep=o&&o.undo?'1':'';
  if(o&&o.undo){const b=document.createElement('button');b.textContent='בטל';b.onclick=()=>{o.undo();el.classList.remove('on');el.dataset.keep=''};el.appendChild(b)}
  el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{el.classList.remove('on');el.dataset.keep=''},o&&o.undo?5000:2200)}

function shrink(file,max,q){return new Promise((ok,bad)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('img'))};im.src=url})}
function thumbOf(dataUrl){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=160/Math.max(im.width,im.height),
  c=document.createElement('canvas'),w=Math.round(im.width*s),h=Math.round(im.height*s),z=Math.min(w,h);
  c.width=c.height=120;c.getContext('2d').drawImage(im,(w-z)/2/s,(h-z)/2/s,z/s,z/s,0,0,120,120);ok(c.toDataURL('image/jpeg',.6))};im.src=dataUrl})}

const AI_SERVER='https://kalori-ai.charlie-remote-render-relay.workers.dev';   // set at deploy (server/worker.js)
const FREE_AI=5, PACKS={ai_50:50,ai_200:200};
function ownKey(){return (S.key||'').trim()}
function useServer(){return !ownKey()&&NAT&&!/REPLACE/.test(AI_SERVER)}
function devId(){if(!S.dev){S.dev=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));LS.set('kal-set',S)}return S.dev}
function aiState(){const t=dk(new Date());S.ai=S.ai||{d:t,n:0,cr:0};if(S.ai.d!==t){S.ai.d=t;S.ai.n=0}return S.ai}
function aiLeft(){const a=aiState();return Math.max(0,FREE_AI-a.n)+(a.cr||0)}
function aiUse(){const a=aiState();if(a.n<FREE_AI)a.n++;else a.cr=Math.max(0,(a.cr||0)-1);LS.set('kal-set',S)}
const SCHEMA={type:'OBJECT',properties:{items:{type:'ARRAY',items:{type:'OBJECT',properties:{
  name:{type:'STRING'},grams:{type:'NUMBER'},kcal:{type:'NUMBER'},protein:{type:'NUMBER'},carbs:{type:'NUMBER'},fat:{type:'NUMBER'}},
  required:['name','grams','kcal','protein','carbs','fat']}},notFood:{type:'BOOLEAN'}},required:['items']};
const PROMPT=`אתה תזונאי מומחה. זהה כל מאכל ומשקה ${'{SRC}'} והערך לכל אחד: שם קצר בעברית, משקל המנה בגרמים כפי שהיא נראית, קלוריות, חלבון, פחמימות ושומן בגרמים (לכל המנה, לא ל-100 גרם).
הערך גודל מנה לפי כלים, ידיים וחפצים בתמונה. כלול שמן, רטבים וממרחים אם נראים. אל תמציא מאכלים שלא רואים.
אם אין אוכל כלל — החזר items ריק ו-notFood=true.`;
// fetch with a time limit: a phone that can't reach Google should fail fast, not after minutes
const DIAG={};
async function fetchT(url,opts,ms,step){
  const ac=new AbortController(),t0=Date.now(),tm=setTimeout(()=>ac.abort(),ms);
  try{return await fetch(url,{...opts,signal:ac.signal})}
  catch(e){const to=ac.signal.aborted;DIAG.last=`${step}: ${to?'timeout':(e.name+': '+e.message)} · ${((Date.now()-t0)/1000).toFixed(1)}s`;
    throw Object.assign(new Error(to?'timeout':'net'),{code:to?'timeout':'net'})}
  finally{clearTimeout(tm)}
}
async function models(key,fresh){
  const c=LS.get('kal-models2',null);
  if(!fresh&&c&&c.k===key.slice(-6)&&Date.now()-c.t<864e5&&c.list.length)return c.list;
  const r=await fetchT(useServer()?AI_SERVER+'/v1/models':API+'models?pageSize=200&key='+encodeURIComponent(key),{},20000,'models');
  if(r.status===400||r.status===403){DIAG.last='models: HTTP '+r.status;throw Object.assign(new Error('key'),{code:'key'})}
  let list=[];
  try{
    const j=await r.json();
    const ver=n=>{const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?+m[1]:0};
    list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace('models/','')).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|live|audio|thinking|exp|embed|native/.test(n))
      // stable models first (preview models are often overloaded: HTTP 503), then flash before lite, newest first
      .sort((a,b)=>{const lite=n=>/lite/.test(n)?1:0,pre=n=>/preview/.test(n)?1:0;
        return pre(a)-pre(b)||lite(a)-lite(b)||ver(b)-ver(a)||a.length-b.length});
  }catch(e){}
  for(const a of ['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'])
    if(!list.includes(a))list.splice(list.findIndex(n=>/preview/.test(n))<0?list.length:list.findIndex(n=>/preview/.test(n)),0,a);
  LS.set('kal-models2',{k:key.slice(-6),t:Date.now(),list});
  return list;
}
async function gen(key,m,parts,schema,ms){
  const cfg={temperature:.2};
  if(schema){cfg.responseMimeType='application/json';cfg.responseSchema=schema}
  const sv=useServer(),url=sv?AI_SERVER+'/v1/models/'+m+':generateContent':API+'models/'+m+':generateContent?key='+encodeURIComponent(key);
  const send=c=>fetchT(url,{method:'POST',headers:sv?{'Content-Type':'application/json','x-device':devId()}:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:c})},ms,m);
  // no "thinking" = much faster; models that don't accept the setting get it without
  let r=await send({...cfg,thinkingConfig:{thinkingBudget:0}});
  if(r.status===400){let msg='';try{msg=(await r.clone().json()).error?.message||''}catch(e){}
    if(/think/i.test(msg))r=await send(cfg)}
  return r;
}
async function analyze({img,text}){
  DIAG.last='';
  const key=ownKey()||(useServer()?'server':'');if(!key)throw Object.assign(new Error('nokey'),{code:'nokey'});
  if(useServer()&&aiLeft()<=0)throw Object.assign(new Error('quota0'),{code:'quota0'});
  const parts=[];
  if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});
  parts.push({text:PROMPT.replace('{SRC}',img?'שרואים בתמונה':'בתיאור הבא')+(text?`\n${img?'הערה מהמשתמש':'התיאור'}: ${text}`:'')});
  let list=await models(key);let last='',tries=0;const log=[];
  const good=LS.get('kal-good','');if(good&&list.includes(good))list=[good,...list.filter(x=>x!==good)];
  for(const m of list.slice(0,10)){
    let r;
    const pg=document.getElementById('prog');if(pg&&log.length)pg.textContent=`גוגל עמוסים, מנסה עוד מודל (${log.length+1})…`;
    try{r=await gen(key,m,parts,SCHEMA,30000)}
    catch(e){if(e.code==='timeout'&&++tries<2){last='timeout';continue}throw e}
    if(r.ok){const j=await r.json();
      const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      try{const o=JSON.parse(t);o.model=m;LS.set('kal-good',m);if(useServer())aiUse();return o}catch(e){last='parse';DIAG.last=m+': bad JSON';continue}}
    const st=r.status;let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
    log.push(`${m}: ${st}`);DIAG.last=log.join(' · ')+' — '+msg.slice(0,90);
    if(st===404)continue;                   // model name not offered to this key
    if(useServer()&&st===429&&/limit/.test(msg))throw Object.assign(new Error('srvcap'),{code:'srvcap'});
    if(st===400&&/API key|API_KEY/i.test(msg))throw Object.assign(new Error('key'),{code:'key'});
    if(st===400&&/location|region|country/i.test(msg))throw Object.assign(new Error('geo'),{code:'geo'});
    if(st===403)throw Object.assign(new Error('key'),{code:'key'});
    if(st===429&&last!=='srv')last='quota';else if(st!==429)last='srv';   // busy / quota → try the next free model
    if(st===503)await new Promise(z=>setTimeout(z,800));
  }
  localStorage.removeItem('kal-models2');
  throw Object.assign(new Error(last),{code:last});
}
// Settings → "check connection": shows exactly where it breaks
async function testConn(out){
  const key=(S.key||'').trim(),line=(ok,t)=>out.insertAdjacentHTML('beforeend',`<div>${ok?'✅':'❌'} ${esc(t)}</div>`);
  out.innerHTML='';DIAG.last='';if(!key){line(0,'אין מפתח');return}
  let t0=Date.now(),list;
  try{list=await models(key,true);line(1,`גוגל עונה (${((Date.now()-t0)/1000).toFixed(1)} שנ׳) · ${list.length} מודלים`)}
  catch(e){line(0,(ERR[e.code]||'שגיאה')+' — '+(DIAG.last||''));return}
  let ok=0;
  for(const m of list.slice(0,10)){
    t0=Date.now();
    try{const r=await gen(key,m,[{text:'Reply with the word OK'}],null,25000);
      if(r.ok){line(1,`${m} עובד (${((Date.now()-t0)/1000).toFixed(1)} שנ׳)`);if(!ok)LS.set('kal-good',m);ok++;break}
      else line(0,`${m}: ${r.status}${r.status===503?' עמוס':r.status===429?' מכסה':r.status===404?' לא זמין':''}`)}
    catch(e){line(0,`${m}: ${e.code}`)}
  }
  line(ok>0,ok?'יש מודל שעובד — האפליקציה תשתמש בו.':'כל המודלים עמוסים או חסומים כרגע. נסה שוב בעוד כמה דקות.');
}

function doBackup(){S.lastBak=dk(new Date());LS.set('kal-set',S);download('kalori-backup-'+dk(new Date())+'.json',backupJson(),'application/json');render()}

async function restoreFile(f){if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o.db)throw 0;
    if(!confirm('לשחזר את הגיבוי? הוא יתמזג עם מה שיש כאן — שום דבר לא יימחק.'))return;

  catch(e){toast('קובץ גיבוי לא תקין')}}
function mergeBackup(o){
  const sig=e=>(e.time||'')+'|'+(e.items||[]).map(x=>x.name+x.kcal).join(',');let days=0;
  for(const [d,list] of Object.entries(o.db||{})){const cur=DB[d]||(DB[d]=[]);if(!cur.length)days++;const have=new Set(cur.map(sig));for(const e of list)if(!have.has(sig(e)))cur.push(e)}
  for(const [d,v] of Object.entries(o.w||{}))if(W[d]==null)W[d]=v;
  for(const [d,v] of Object.entries(o.fit||{}))if(!FIT[d])FIT[d]=v;
  for(const [d,v] of Object.entries(o.m||{}))if(!M[d])M[d]=v;

/* ================= controlled weight loss =================
   W = weigh-ins {date:kg} · M = measurements {date:{waist,belly,photo}} · S.plan = {target,rate,start:{d,w}}
   trend = exponential moving average of the weigh-ins (10% per weigh-in), so one salty day does not look like a gain */
let W=LS.get('kal-w',{}),M=LS.get('kal-m',{});
const KG=7700;                                     // ≈ kcal in 1 kg of body fat
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return dk(x)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fmtD=(d,o)=>new Date(d+'T12:00').toLocaleDateString('he-IL',o||{day:'numeric',month:'numeric'});
const kg=x=>x==null||isNaN(x)?'–':(Math.round(x*10)/10).toFixed(1);
function trendSeries(){                            // [{d,w,t}] for every day from the first weigh-in to today
  const ds=Object.keys(W).sort();if(!ds.length)return [];
  const out=[],today=dk(new Date());let t=W[ds[0]];
  for(let d=ds[0];d<=today;d=addDays(d,1)){const w=W[d];if(w!=null)t=t+.1*(w-t);out.push({d,w:w??null,t})}
  out[0].t=W[ds[0]];return out;
}
function trendAt(d){const s=trendSeries();if(!s.length)return null;const i=s.findIndex(x=>x.d===d);return i<0?(d<s[0].d?null:s[s.length-1].t):s[i].t}
function curWeight(){const s=trendSeries();return s.length?s[s.length-1].t:(+S.prof.w||null)}
function lastWeigh(){const ds=Object.keys(W).sort();return ds.length?{d:ds[ds.length-1],w:W[ds[ds.length-1]]}:null}
function actualRate(){                             // kg per week, from the trend of the last 14 days (positive = losing)
  const s=trendSeries();if(s.length<8||Object.keys(W).length<3)return null;
  const a=s[Math.max(0,s.length-15)],b=s[s.length-1],n=daysBetween(a.d,b.d);return n>=7?(a.t-b.t)/n*7:null;
}
// kg per week from the weigh-ins themselves (least squares, last 14 days) — the trend line lags behind a fast drop
function rawRate(){const today=dk(new Date()),pts=Object.entries(W).filter(([d])=>d>=addDays(today,-14)).map(([d,w])=>[daysBetween(today,d),w]);
  if(pts.length<4)return null;const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
  const sl=pts.reduce((s,p)=>s+(p[0]-mx)*(p[1]-my),0)/pts.reduce((s,p)=>s+(p[0]-mx)**2,0);return -sl*7}
function minKcal(){return S.prof.sex==='f'?1200:1500}
function maxRate(){const w=curWeight()||80;return Math.round(w*.01*4)/4||.5}   // ≈1% of body weight per week
function formulaTdee(w){const p=S.prof;w=w||curWeight()||p.w;if(!(p.age>0&&p.h>0&&w>0))return null;
  return (10*w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5))*(S.act||1.375)}
// learn the real daily burn: intake minus what the weight trend says was stored/lost (last 28 days, needs ≥10 logged days)
function adaptiveTdee(){
  const today=dk(new Date()),end=addDays(today,-1),start=addDays(end,-27);
  let n=0,sum=0;for(let d=start;d<=end;d=addDays(d,1)){const k=totals(DB[d]).kcal;if(k>=600){n++;sum+=k}}
  const ws=Object.keys(W).filter(d=>d>=start&&d<=end);
  if(n<10||ws.length<3)return {n,ok:false};
  const s=trendSeries(),first=s.find(x=>x.d>=start),last=s.filter(x=>x.d<=end).pop();
  if(!first||!last||daysBetween(first.d,last.d)<10)return {n,ok:false};
  const span=daysBetween(first.d,last.d),tdee=sum/n+(first.t-last.t)*KG/span;
  return {n,ok:true,tdee};
}
function planTarget(){
  const f=formulaTdee();if(!f)return null;
  const a=adaptiveTdee();let tdee=f,wgt=0;
  if(a.ok){wgt=Math.min(1,(a.n-7)/14);const lim=Math.max(f*.65,Math.min(f*1.35,a.tdee));tdee=f*(1-wgt)+lim*wgt}
  const pl=S.plan||{rate:0},rate=S.goalType==='lose'?Math.min(pl.rate||.5,maxRate()):0;
  let kcal=tdee-rate*KG/7+(S.goalType==='gain'?300:0),clamped=false;
  if(kcal<minKcal()){kcal=minKcal();clamped=true}
  return {kcal:Math.round(kcal/50)*50,tdee:Math.round(tdee),formula:Math.round(f),adaptive:a.ok?Math.round(a.tdee):null,n:a.n,learned:wgt,clamped,rate};
}
function macrosFor(kcal){const w=curWeight()||S.prof.w||70;
  const protein=Math.round(Math.min(w*(S.goalType==='lose'?1.8:1.6),kcal*.35/4)),fat=Math.round(kcal*.27/9),carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,carbs,fat}}
function applyPlan(){const t=planTarget();if(!t)return null;S.goal=macrosFor(t.kcal);LS.set('kal-set',S);return t}
function eta(){const pl=S.plan,w=curWeight();if(!pl||!w||S.goalType!=='lose')return null;
  const left=w-pl.target;if(left<=0)return {done:true};
  const r=actualRate(),rate=r&&r>.05?r:Math.min(pl.rate,maxRate());return {d:addDays(dk(new Date()),Math.round(left/rate*7)),left,rate,real:!!(r&&r>.05)}}
/* streak = days in a row with something logged (today counts once it has an entry) */
function streak(){let d=dk(new Date()),n=0;if(!(DB[d]||[]).length)d=addDays(d,-1);while((DB[d]||[]).length){n++;d=addDays(d,-1)}return n}
function weekStart(d){const x=new Date((d||dk(new Date()))+'T12:00');x.setDate(x.getDate()-x.getDay());return dk(x)}
function weekBudget(){const ws=weekStart(),today=dk(new Date());let eaten=0;for(let d=ws;d<=today;d=addDays(d,1))eaten+=totals(DB[d]).kcal;
  const total=S.goal.kcal*7,daysLeft=7-daysBetween(ws,today),eatenBefore=eaten-totals(DB[today]).kcal;
  return {total,eaten,left:total-eaten,daysLeft,perDay:Math.round((total-eatenBefore)/daysLeft)}}
function proteinIdeas(){
  const pool=[...Object.values(MY).map(o=>({names:[o.name],...o,my:1})),...FOODS];
  return pool.filter(f=>f.unit&&f.protein>=8&&f.kcal>0).map(f=>({f,p:f.protein*f.unit/100,k:f.kcal*f.unit/100,score:f.protein/f.kcal*(f.my?1.3:1)}))
    .sort((a,b)=>b.score-a.score).slice(0,4)}
/* milestones: every whole kg below the start weight, and streaks of 7/14/30 days — each celebrated once */
function checkMilestones(){
  S.ms=S.ms||[];const out=[];
  if(S.plan&&S.plan.start){const lost=Math.floor((S.plan.start.w-curWeight())+.05);if(lost>=1&&!S.ms.includes('kg'+lost)){S.ms.push('kg'+lost);out.push(`ירדת ${lost} ק״ג! 🎉`)}}
  const st=streak();for(const n of [7,14,30,60,100])if(st>=n&&!S.ms.includes('st'+n)){S.ms.push('st'+n);out.push(`${n} ימים ברצף של רישום! 🔥`)}
  if(out.length){LS.set('kal-set',S);setTimeout(()=>{toast(out[out.length-1]);confetti()},500)}
}
function confetti(){const c=document.createElement('div');c.className='conf';
  for(let i=0;i<36;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${['#12b76a','#f79009','#2e90fa','#ee46bc','#fdb022'][i%5]};animation-delay:${Math.random()*.4}s;transform:rotate(${Math.random()*360}deg)`;c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}

  const p=S.prof;if(!(p.age>0&&p.h>0&&w)){close('#shProg');openOnb(1);return}

      `<button data-v="${v}" class="${v==pl.rate?'on':''}" ${v>mr+.01?'disabled':''}><div><b>${n}</b><span>${d}${v>mr+.01?' — יותר מ-1% ממשקל הגוף, לא מומלץ':''}</span></div></button>`).join('')}</div>
    <div id="pOut" class="goalbox" style="margin-top:12px"></div>

  const draw=()=>{const T=num($('#pT').value),R=+($('#pR .on')||{dataset:{v:.5}}).dataset.v;
    const old=S.plan,og=S.goalType;S.plan={...(old||{}),target:T,rate:R};S.goalType='lose';const t=planTarget();S.plan=old;S.goalType=og;

/* ---------- weekly check-in (once, when a new week starts) ---------- */
function weekReport(ws){
  const we=addDays(ws,6);let n=0,k=0,p=0,df=0,dn=0;
  for(let d=ws;d<=we;d=addDays(d,1)){const t=totals(DB[d]);if(t.kcal<300)continue;n++;k+=t.kcal;p+=t.protein;const b=burnOf(d);if(b&&!b.noRest){df+=b.tot-t.kcal;dn++}}
  const t0=trendAt(addDays(ws,-1))??trendAt(ws),t1=trendAt(we);
  let inR=0;for(let d=ws;d<=we;d=addDays(d,1)){const t=totals(DB[d]);if(t.kcal>=300&&t.kcal<=S.goal.kcal*1.05&&t.kcal>=S.goal.kcal*.8)inR++}
  return {ws,we,n,inR,avgK:n?k/n:0,avgP:n?p/n:0,avgDf:dn?df/dn:null,dW:t0!=null&&t1!=null?t1-t0:null}}
function maybeCheckin(){
  const ws=weekStart(),prev=addDays(ws,-7);if(S.lastCheck===ws||!S.onb)return;
  const r=weekReport(prev);if(r.n<2){S.lastCheck=ws;LS.set('kal-set',S);return}
  setTimeout(()=>{if(!document.querySelector('.sheet.on'))openCheckin(r,ws)},900);
}
function openCheckin(r,ws){
  const t=S.plan?planTarget():null,g=S.goal;

  if(r.n<5)tips.push(['book','רשמת '+r.n+' ימים מתוך 7. ככל שהרישום מלא יותר — החישוב מדויק יותר.']);
  if(r.avgP<g.protein*.8)tips.push(['target','חלבון ממוצע '+r0(r.avgP)+' ג׳ מתוך '+g.protein+'. חלבון שומר על השריר ומשביע — נסה קוטג׳, יוגורט, ביצים או עוף.']);
  const cw=curWeight()||S.prof.w||80,rr=rawRate(),loss=Math.max(r.dW!=null?-r.dW:0,rr||0),fast=loss>cw*.01;
  if(fast)tips.push(['warn',`יורד בערך ${loss.toFixed(2)} ק״ג בשבוע — יותר מ-1% ממשקל הגוף. מהר מדי לירידה מבוקרת: כדאי לאכול קצת יותר.`]);
  if(r.dW!=null&&r.dW>0&&r.avgK<g.kcal)tips.push(['chart','המשקל עלה למרות שאכלת מתחת ליעד — כנראה מים/מלח. זה מתאזן בדרך כלל תוך כמה ימים.']);
  if(!S.lastBak||daysBetween(S.lastBak,dk(new Date()))>=3)tips.push(['save','גיבוי שבועי: שמור קובץ גיבוי כדי שהנתונים לא ילכו לאיבוד. <button class="pill g" id="ciBak">שמור גיבוי</button>']);
  if(!tips.length)tips.push(['star','שבוע מצוין — ממשיכים ככה!']);

      <div><b>${r0(r.avgK).toLocaleString()}</b><span>קל׳ ממוצע ליום</span></div>
      <div><b>${r.inR}/${r.n||0}</b><span>ימים בטווח היעד</span></div>

    ${newK?`<div class="goalbox" style="margin-top:12px"><div class="mut">${fast?'כדי להאט לקצב בריא':t.adaptive?`לפי ${t.n} ימי הרישום שלך הגוף שורף ≈ ${t.tdee.toLocaleString()} ליום`:'לפי המשקל המעודכן שלך'}</div>
      <div class="big2" style="font-size:2rem">${g.kcal.toLocaleString()} ← ${newK.toLocaleString()}</div><div class="mut">יעד יומי מוצע</div></div>
      <div class="row" style="margin-top:12px"><button class="btn sec" id="ciKeep">השאר ${g.kcal.toLocaleString()}</button><button class="btn" id="ciOk">עדכן יעד</button></div>`
      :`<button class="btn w" id="ciKeep" style="margin-top:14px">יאללה, שבוע חדש</button>`}`;
  open('#shAdd');S.lastCheck=ws;LS.set('kal-set',S);

}

/* ---------- progress screen ---------- */
function wChart(){
  const s=trendSeries();if(s.length<1)return '<div class="empty">אין עדיין שקילות. הוסף שקילה ראשונה.</div>';
  const today=dk(new Date()),from=addDays(today,-59),pts=s.filter(x=>x.d>=from);if(!pts.length)return '';
  const e=eta(),pl=S.plan,proj=[];
  if(e&&!e.done){const last=pts[pts.length-1];for(let i=0;i<=21;i+=3)proj.push({d:addDays(today,i),t:last.t-e.rate/7*i})}
  const all=[...pts.map(x=>x.w??x.t),...pts.map(x=>x.t),...proj.map(x=>x.t)];if(pl)all.push(pl.target);
  let lo=Math.min(...all),hi=Math.max(...all);if(pl&&pl.target<lo-3)lo=Math.min(...all.filter(x=>x!==pl.target));
  lo=Math.floor(lo-.5);hi=Math.ceil(hi+.5);
  const W0=340,H0=170,x0=from<pts[0].d?pts[0].d:from,x1=proj.length?proj[proj.length-1].d:today,span=Math.max(7,daysBetween(x0,x1));
  const X=d=>8+daysBetween(x0,d)/span*(W0-40),Y=v=>10+(hi-v)/(hi-lo)*(H0-30);
  let g=`<svg viewBox="0 0 ${W0} ${H0}" class="wch" preserveAspectRatio="none">`;
  for(let v=lo;v<=hi;v+=Math.max(1,Math.round((hi-lo)/4)))g+=`<line x1="8" x2="${W0-32}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${W0-2}" y="${Y(v)+4}" class="gt" text-anchor="end">${v}</text>`;
  if(pl&&pl.target>=lo)g+=`<line x1="8" x2="${W0-32}" y1="${Y(pl.target)}" y2="${Y(pl.target)}" class="tg"/><text x="12" y="${Y(pl.target)-4}" class="gt tgt">${pl.target} יעד</text>`;
  g+=`<polyline class="tl" points="${pts.map(x=>X(x.d)+','+Y(x.t)).join(' ')}"/>`;
  if(proj.length)g+=`<polyline class="pj" points="${proj.map(x=>X(x.d)+','+Y(x.t)).join(' ')}"/>`;
  for(const x of pts)if(x.w!=null)g+=`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="2.6" class="dt"/>`;
  g+=`<text x="8" y="${H0-4}" class="gt">${fmtD(x0)}</text><text x="${W0-34}" y="${H0-4}" class="gt" text-anchor="end">${fmtD(x1)}</text></svg>`;
  return g+'<div class="leg"><span><i class="l1"></i>מגמה</span><span><i class="l2"></i>שקילות</span>'+(proj.length?'<span><i class="l3"></i>תחזית</span>':'')+'</div>';
}

    ${mk.length?`<div class="mlist">${mk.map(d=>{const m=M[d];return `<div class="mrow" data-md="${d}">${m.photo?`<img src="${m.photo}" alt="">`:'<span class="mi" style="--mb:var(--soft);--mf:var(--mut)">'+ic('ruler',20)+'</span>'}
      <div><b>${fmtD(d,{day:'numeric',month:'long'})}</b><span class="mut">${[m.waist?'מותניים '+m.waist:'',m.belly?'בטן '+m.belly:'',m.hip?'ירכיים '+m.hip:''].filter(Boolean).join(' · ')||'תמונה'}</span></div></div>`}).join('')}</div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn sec" id="pgHist">${ic('table',18)} יומן 14 ימים</button><button class="btn sec" id="pgRem">${ic('watch',18)} תזכורת יומית</button></div>`;
  open('#shProg');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='bHist'));
  $('#pgW').onclick=()=>{close('#shProg');openWeigh()};
  $('#pgPlan').onclick=()=>{close('#shProg');openPlan()};
  $('#pgM').onclick=()=>openMeasure(dk(new Date()));
  $('#progPn').querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>openMeasure(x.dataset.md));
  $('#pgHist').onclick=()=>{close('#shProg');openHist()};
  $('#pgRem').onclick=()=>{close('#shProg');openRemind()};
}
function openMeasure(d){
  const m=M[d]||{};
  $('#addPn').innerHTML=`<h2>מדידה · ${fmtD(d,{day:'numeric',month:'long'})}</h2>
    <p class="note">פעם בשבועיים מספיק. מודדים בבוקר, בגובה הטבור. לפעמים המשקל עומד והמותניים יורדות — זה עדיין התקדמות.</p>
    <div class="g4" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div><label>מותניים (ס״מ)</label><input class="i" id="mW" type="number" inputmode="decimal" value="${m.waist||''}"></div>
      <div><label>בטן (ס״מ)</label><input class="i" id="mB" type="number" inputmode="decimal" value="${m.belly||''}"></div>
      <div><label>ירכיים (ס״מ)</label><input class="i" id="mH" type="number" inputmode="decimal" value="${m.hip||''}"></div></div>
    ${m.photo?`<img class="prev" src="${m.photo}" alt="" style="margin-top:12px;max-height:280px;object-fit:contain">`:''}
    <button class="btn sec w" id="mPh" style="margin-top:12px">${ic('camera',18)} ${m.photo?'החלף תמונה':'הוסף תמונת התקדמות'}</button>
    <input type="file" id="mFile" accept="image/*" hidden>
    <p class="note">התמונה נשמרת רק בטלפון הזה, לא נשלחת לשום מקום.</p>
    <div class="row" style="margin-top:12px">${M[d]?'<button class="btn del" id="mDel">מחק</button>':''}<button class="btn" id="mOk">שמור</button></div>`;
  open('#shAdd');
  let photo=m.photo||null;
  $('#mPh').onclick=()=>{$('#mFile').value='';$('#mFile').click()};
  $('#mFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{photo=await shrink(f,420,.62);$('#mPh').textContent='✓ תמונה נבחרה'}catch(e){toast('לא הצלחתי לפתוח את התמונה')}};
  $('#mOk').onclick=()=>{const o={waist:num($('#mW').value)||null,belly:num($('#mB').value)||null,hip:num($('#mH').value)||null,photo};
    if(!o.waist&&!o.belly&&!o.hip&&!o.photo){toast('אין מה לשמור');return}
    M[d]=o;if(!LS.set('kal-m',M)){delete M[d].photo;LS.set('kal-m',M);toast('אין מקום לתמונה — נשמרו רק המידות')}else toast('נשמר ✓');openProg();close('#shAdd')};
  if($('#mDel'))$('#mDel').onclick=()=>{delete M[d];LS.set('kal-m',M);close('#shAdd');openProg()};
}
function openRemind(){
  if(LN){openRemindNative();return}
  $('#addPn').innerHTML=`<h2>תזכורת יומית</h2>
    <p class="note">אפליקציה מהאתר לא יכולה לשלוח התראות לבד, אבל אייפון יכול — דרך "פעולות אוטומטיות":</p>
    <ol class="sc">
      <li>קיצורים ← לשונית <b>פעולות אוטומטיות</b> ← <b>+</b></li>
      <li><b>שעה ביום</b> ← למשל 20:30 ← <b>יומי</b> ← בחר <b>הרץ מיד</b></li>
      <li><b>פעולה חדשה ריקה</b> ← חפש <b>הצג הודעה</b> (Show Notification)</li>
      <li>כתוב: <code>רשמת היום מה אכלת? 🍽️</code></li>
      <li>אפשר עוד אחת ב-7:30: <code>שקילת בוקר ⚖️</code></li>
    </ol>
    <button class="btn w" id="rmOk" style="margin-top:12px">הבנתי</button>`;
  open('#shAdd');$('#rmOk').onclick=()=>close('#shAdd');
}

function openRemindNative(){
  const R2=S.rem||{};
  $('#addPn').innerHTML=`<h2>תזכורות</h2><p class="note">התראה יומית באייפון. אפשר לכבות בכל רגע.</p>
    <div class="grp" style="padding:4px 14px">
      <label class="rrow"><input type="checkbox" id="rW" ${R2.w?'checked':''}><span>שקילת בוקר</span><input class="i" type="time" id="rWt" value="${R2.w||'07:30'}"></label>
      <label class="rrow"><input type="checkbox" id="rL" ${R2.l?'checked':''}><span>רישום אוכל בערב</span><input class="i" type="time" id="rLt" value="${R2.l||'20:30'}"></label></div>
    <button class="btn w" id="rmOk" style="margin-top:14px">שמור</button>`;
  open('#shAdd');
  $('#rmOk').onclick=async()=>{S.rem={w:$('#rW').checked?$('#rWt').value:null,l:$('#rL').checked?$('#rLt').value:null};LS.set('kal-set',S);await lnSchedule();close('#shAdd');toast('נשמר ✓')};
}
/* ---------- AI packs: consumable in-app purchases (App Store), credits kept on the phone ---------- */
const PAY=(()=>{let ready=null;const pend={};
  function init(){if(ready)return ready;ready=new Promise(res=>{const go=()=>{const C=window.CdvPurchase;if(!C||!C.store){res(false);return}
      const {store,ProductType,Platform}=C;
      store.register(Object.keys(PACKS).map(id=>({id,platform:Platform.APPLE_APPSTORE,type:ProductType.CONSUMABLE})));
      store.when().approved(tx=>{for(const p of tx.products){const n=PACKS[p.id];if(!n)continue;const a=aiState();a.cr=(a.cr||0)+n;LS.set('kal-set',S);
          if(pend[p.id]){pend[p.id](true);delete pend[p.id]}else toast(`נוספו ${n} זיהויי AI ✓`)}
        tx.finish()});
      store.error(()=>{for(const k in pend){pend[k](false);delete pend[k]}});
      store.initialize([Platform.APPLE_APPSTORE]).then(()=>res(true)).catch(()=>res(false))};
    if(window.CdvPurchase)go();else document.addEventListener('deviceready',go,{once:true});setTimeout(()=>res(false),15000)});return ready}
  return {init,
    price(id){try{const p=window.CdvPurchase.store.get(id);return p&&p.pricing&&p.pricing.price||''}catch(e){return ''}},
    buy(id){return init().then(ok=>{if(!ok)return false;const st=window.CdvPurchase.store,pr=st.get(id),of=pr&&pr.getOffer();if(!of){toast('החנות לא זמינה כרגע');return false}
      return new Promise(res=>{pend[id]=res;st.order(of).then(err=>{if(err&&pend[id]){delete pend[id];res(false)}})})})}}})();
function openPaywall(){
  const a=aiState(),left=aiLeft();
  $('#addPn').innerHTML=`<div class="cih">${art('i_scanfood','')}</div><h2>זיהויי AI</h2>
    <p class="note">כל יום כלולים <b>${FREE_AI} זיהויי AI חינם</b> (צילום צלחת או חישוב מאכל חדש), והם מתחדשים כל בוקר.
    ${left>0?`נשארו לך היום <b>${left}</b>.`:'הזיהויים של היום נגמרו.'} מי שצריך יותר יכול לקנות חבילה — היא לא פגה ונשארת עד שמשתמשים בה.</p>
    <div class="paks">${Object.entries(PACKS).map(([id,n])=>`<button class="pak" data-pk="${id}"><b>${n}</b><span>זיהויים</span><em id="pr_${id}">${PAY.price(id)||(id==='ai_50'?'₪9.90':'₪29.90')}</em></button>`).join('')}</div>
    <p class="note">יתרת חבילות: <b>${a.cr||0}</b>. חיפוש במאגר, "המאגר שלי", צילום מסך של ערכים ומעקב — ללא הגבלה, גם בלי AI.</p>
    <button class="btn sec w" id="pwC" style="margin-top:8px">סגור</button>`;
  open('#shAdd');
  $('#pwC').onclick=()=>close('#shAdd');
  PAY.init().then(()=>{for(const id in PACKS){const e=document.getElementById('pr_'+id),p=PAY.price(id);if(e&&p)e.textContent=p}});
  $('#addPn').querySelectorAll('[data-pk]').forEach(b=>b.onclick=async()=>{if(!NAT){toast('קנייה זמינה באפליקציה מה-App Store');return}
    b.disabled=true;const ok=await PAY.buy(b.dataset.pk);b.disabled=false;if(ok){toast(`נוספו ${PACKS[b.dataset.pk]} זיהויים ✓`);openPaywall()}});
}

else{maybeCheckin();checkMilestones()}
prefMirrorAll();
if(NAT)setTimeout(()=>PAY.init(),2500);
if(HK){hkAuto();document.addEventListener('visibilitychange',()=>{if(!document.hidden)hkAuto()})}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
